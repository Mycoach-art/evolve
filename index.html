function cbDurFor(k){return [2,4,6][phaseOf(Math.max(1,progWeek(parseKey(k))))]*60}
function cbPh(t){const pe=CB.prep+CB.entry;
  if(t<CB.prep)return {k:"prep",i:4,e:6,t0:0,left:CB.prep-t,lab:"avant d'entrer",tip:"Respire lentement : par le nez, puis un long souffle par la bouche."};
  if(t<pe)return {k:"entry",t0:CB.prep,left:pe-t,lab:"entre dans l'eau",tip:"Lentement, jusqu'aux épaules. Souffle longuement, sans bloquer."};
  const s=t-pe;
  if(s<Math.min(60,CB.dur))return {k:"shock",i:3,e:6,t0:pe,left:CB.dur-s,lab:"restantes",tip:"Le choc : souffle long, comme dans une paille. Il passe en une minute."};
  if(s<CB.dur)return {k:"calm",i:4,e:6,t0:pe+60,left:CB.dur-s,lab:"restantes",tip:CB.dur-s<=15?"Dernières secondes. Reste calme.":"Immobile, épaules sous l'eau, mains relâchées."};
  return {k:"end",left:0}}
const cbMMSS=x=>{x=Math.max(0,Math.ceil(x));return `${Math.floor(x/60)}:${String(x%60).padStart(2,"0")}`};
function cbTone(f,d,v,at){if(!CB.snd||!CB.ac)return;try{const C=CB.ac,o=C.createOscillator(),g=C.createGain(),t=C.currentTime+(at||0);o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(C.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function cbView(){
  if(CB.st==="done")return `<div class="cb-frost" aria-hidden="true"></div><div class="cb-top"><span></span><span class="cb-ttl">Bain froid</span><span></span></div>

   <button class="cb-btn" data-cb="close">Terminer</button>`;
  const run=CB.st==="run",C=2*Math.PI*48;
  return `<div class="cb-frost" aria-hidden="true"></div>

function cbLoop(){if(CB.st!=="run")return;const t=(Date.now()-CB.t0)/1000,P=cbPh(t);
  if(P.k==="end"){cbFinish(true);return}
  const disc=document.getElementById("cb-disc"),tt=document.getElementById("cb-t"),ll=document.getElementById("cb-l"),w=document.getElementById("cb-w"),tip=document.getElementById("cb-tip"),arc=document.getElementById("cb-arc");
  let sc=.86,word="",key=P.k;
  if(P.i){const cyc=P.i+P.e,x=(t-P.t0)%cyc,inh=x<P.i,f=inh?x/P.i:(x-P.i)/P.e,e=.5-.5*Math.cos(Math.PI*f);sc=inh?.72+.28*e:1-.28*e;word=inh?"Inspire":"Expire";key+=(inh?"i":"e")+Math.floor((t-P.t0)/cyc);
    if(key!==CB.lastKey&&CB.snd){const id=inh?"cue2-inspire":"cue2-expire";if(AUD.buf[id])audCue(id,1);else if(inh)cbTone(523,.35,.05);else cbTone(392,.5,.04)}}
  else{sc=.8+.03*Math.sin(t*2);word="Entre doucement";if(CB.lastKey.indexOf("entry")!==0){cbTone(660,1,.12);cbTone(880,1.1,.1,.25)}}
  CB.lastKey=key;
  if(disc)disc.style.transform=`scale(${sc.toFixed(4)})`;
  if(tt){const v=cbMMSS(P.left);if(tt.textContent!==v)tt.textContent=v}
  if(ll&&ll.textContent!==P.lab)ll.textContent=P.lab;
  if(w&&w.textContent!==word)w.textContent=word;
  if(tip&&tip.textContent!==P.tip)tip.textContent=P.tip;
  if(arc){const C=2*Math.PI*48,pe=CB.prep+CB.entry,pr=t<pe?0:Math.min(1,(t-pe)/CB.dur);arc.setAttribute("stroke-dashoffset",(C*(1-pr)).toFixed(2))}

async function cbGo(){CB.st="run";CB.t0=Date.now();CB.lastKey="";
  audPlay();
  try{CB.ac=audCtx();if(CB.ac&&CB.ac.state==="suspended")await CB.ac.resume();audLoad(["cue2-inspire","cue2-expire"])}catch(e){CB.ac=null}

  cbRender();cancelAnimationFrame(CB.raf);CB.raf=requestAnimationFrame(cbLoop)}

  try{CB.wake&&CB.wake.release()}catch(e){}CB.wake=null;
  if(full||inWater>=60){const k=CB.date||ui.date,d=dayObj(k);d.c.froid=1;d.v.froidsec=Math.round(Math.min(CB.dur,Math.max(0,inWater)));save("days",k);CB.st="done";cbTone(784,1.2,.12);cbTone(988,1.4,.1,.3);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}cbRender()}
  else{CB.st="ready";cbRender();toast("Séance arrêtée avant la première minute : rien n'est coché")}}
function cbOpen(k){try{audLoad(["cue2-inspire","cue2-expire"])}catch(e){}CB.date=k||ui.date;CB.dur=cbDurFor(CB.date);CB.st="ready";const el=document.getElementById("cb");el.hidden=false;document.body.style.overflow="hidden";cbRender()}
function cbClose(){if(CB.st==="run"){if(CB.ask<Date.now()-2500){CB.ask=Date.now();toast("Séance en cours : touche encore pour quitter");return}cancelAnimationFrame(CB.raf);try{CB.wake&&CB.wake.release()}catch(e){}CB.wake=null}
  CB.ask=0;CB.st="ready";document.getElementById("cb").hidden=true;document.body.style.overflow=ui.mod?"hidden":"";render(true)}
const CBA={go(){if(CB.st!=="run")cbGo()},close(){cbClose()},snd(el){CB.snd=!CB.snd;el.classList.toggle("off",!CB.snd);el.setAttribute("aria-pressed",CB.snd);el.setAttribute("aria-label","Voix "+(CB.snd?"activée":"coupée"))},

function setSync(s){ui.sync=s;const el=document.querySelector(".sync");if(el){el.className="sync sync-"+s;el.textContent=SYNC[s]}}
function save(kind,id){
  persistLocal();
  if(kind==="decks")persistDecks();
  if(!store.on)return;
  if(kind==="decks"){for(const [d,val] of deckDocs(id))queueDoc(`evolve/profile/decks/${d}`,()=>val);return}
  const path=kind==="profile"?"evolve/profile":`evolve/profile/${kind}/${id}`;
  queueDoc(path,()=>kind==="profile"?state.profile:(state[kind][id]??null));
}
const DKP=150;
function deckDocs(id){const D=state.decks[id];if(!D)return [[id,null]];const {cards,...m}=D,n=Math.ceil((cards||[]).length/DKP),out=[[id,Object.assign({},clone(m),{cards:[],parts:n})]];
  for(let k=0;k<n;k++)out.push([`${id}--p${k+1}`,{of:id,k:k+1,cards:clone(cards.slice(k*DKP,(k+1)*DKP))}]);return out}
function joinDecks(next){const parts={};for(const k of Object.keys(next)){const m=k.match(/^(.*)--p(\d+)$/);if(m){(parts[m[1]]=parts[m[1]]||[])[Number(m[2])-1]=next[k];delete next[k]}}
  for(const [id,D] of Object.entries(next)){if(!D||!D.parts)continue;const ps=parts[id]||[],cards=[...(D.cards||[])];let ok=true;
    for(let k=0;k<D.parts;k++){if(!ps[k]||!Array.isArray(ps[k].cards)){ok=false;break}cards.push(...ps[k].cards)}
    if(ok){const {parts:_p,...rest}=D;next[id]=Object.assign(rest,{cards})}else if(state.decks[id])next[id]=state.decks[id];else delete next[id]}
  return next}
function queueDoc(path,get){
  store.pending.add(path);
  store.ver.set(path,(store.ver.get(path)||0)+1);
  clearTimeout(store.timers.get(path));
  store.timers.set(path,setTimeout(()=>flush(path,get),450));
  setSync("saving");
}
async function flush(path,get,retry){
  if(store.busy.get(path)){store.timers.set(path,setTimeout(()=>flush(path,get),300));return}
  store.busy.set(path,true);
  const v=store.ver.get(path);
  const data=get();
  try{
    if(data==null) await store.db.doc(path).delete();
    else await store.db.doc(path).set(clone(data));
    if(store.ver.get(path)===v) store.pending.delete(path);
    if(!store.pending.size) setSync("ok");
  }catch(e){
    const code=e&&e.code;
    if(code==="unavailable"&&!retry){store.busy.set(path,false);setTimeout(()=>flush(path,get,true),800+Math.random()*800);return}
    setSync(code==="invalid_argument"?"readonly":"error");
    if(code==="quota_exceeded") toast("Stockage plein : supprime d'anciennes données.");
  }
  store.busy.set(path,false);
}
function applyCol(kind,qs){
  const next={};
  qs.docs.forEach(doc=>{next[doc.id]=clone(doc.data())});
  for(const [id,val] of Object.entries(state[kind])){if(store.pending.has(`evolve/profile/${kind}/${id}`)) next[id]=val}
  for(const id of Object.keys(next)){if(store.pending.has(`evolve/profile/${kind}/${id}`)&&!(id in state[kind])) delete next[id]}
  if(kind==="decks"){joinDecks(next);state.decks=next;mergeBuiltin();persistLocal();persistDecks();schedRender();return}
  state[kind]=next;persistLocal();schedRender();
}
function pushAll(src){
  state.profile=normProfile(src&&src.profile);
  save("profile");
  for(const kind of ["days","lectures","journal","srs"]){
    const obj=(src&&src[kind])||{};
    for(const [id,val] of Object.entries(obj)){state[kind][id]=val;save(kind,id)}
  }
}
async function initDb(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const db=await window.claude.use("db");
    if(!db)return;
    store.db=db;store.on=true;setSync("ok");
    const prof=db.doc("evolve/profile");
    const err=e=>{setSync(e&&e.code==="revoked"?"readonly":"error")};
    prof.onSnapshot(snap=>{
      if(!snap.exists){
        if(snap.metadata&&snap.metadata.fromCache)return;
        if(store.pushed)return;
        store.pushed=true;
        if(bootCopy&&bootCopy.profile) pushAll(bootCopy); else {state.profile=normProfile(null);save("profile")}
        schedRender();return;
      }
      if(store.pending.has("evolve/profile"))return;
      state.profile=normProfile(clone(snap.data()));persistLocal();schedRender();
    },err);
    for(const kind of ["days","lectures","journal","srs","decks"]){
      prof.collection(kind).onSnapshot(qs=>applyCol(kind,qs),err);
    }
  }catch(e){store.on=false;setSync("local")}
}

const runLvl=()=>{const r=state.profile.run||{};return Math.max(1,Math.min(RUN_LEVELS.length,Number(r.lvl)||1))};
function runPlan(date){
  const w=Math.max(1,progWeek(date)),lvl=runLvl(),L=RUN_LEVELS[lvl-1],since=Math.max(1,Number((state.profile.run||{}).since)||1);
  const raw=Math.floor(Math.max(0,w-since)/4),nb=L.blocks.length,bi=lvl===RUN_LEVELS.length?raw%nb:Math.min(nb-1,raw),ended=lvl<RUN_LEVELS.length&&raw>=nb;
  const wd=date.getDay(),days=ordered(daysOf("course")),i=days.indexOf(wd),n=days.length;
  const idx=i<0?0:n>=3?Math.min(2,i):n===2?[0,2][i]:2;
  const S=L.blocks[bi][idx],light=lightWeek(w),kind=lvl>=3?["facile","qualité","longue"][idx]:lvl===2?["facile","facile","longue"][idx]:"facile";
  const min=light&&!S.x?Math.round(S.min*0.75):S.min;
  return {kind,txt:S.t,min,lvl,L,bi,nb,ended,light,x:S.x||"facile",first:idx===0};
}

function dial(v,wk){

  for(let i=1;i<=10;i++){const a=Math.PI-(i-1)/9*Math.PI;t+=`<text x="${(cx+(R+15)*Math.cos(a)).toFixed(1)}" y="${(cy-(R+15)*Math.sin(a)+4).toFixed(1)}" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="var(--muted)">${i}</text>`}
  const val=v||5,ang=Math.PI-(val-1)/9*Math.PI,rot=90-ang*180/Math.PI;

   <rect x="0" y="0" width="300" height="168" fill="transparent"/>${t}
   <g class="needle" transform="rotate(${rot.toFixed(1)} ${cx} ${cy})" style="opacity:${v?1:.35}"><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-R+20}" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/></g>
   <circle cx="${cx}" cy="${cy}" r="9" fill="var(--accent)"/><path d="M${cx-4} ${cy}h8M${cx} ${cy-4}v8" stroke="var(--on-accent)" stroke-width="1.6"/>
  </svg><div class="dialval" data-dialval="${wk}">${v||"–"}</div><div class="dialhint">Glisse le long de l'arc · flèches au clavier</div></div>`;
}

function halo(score){
  const S=260,c=130;let s="";
  for(let r=20;r<=122;r+=12){const n=Math.round(2*Math.PI*r/11),rad=1.9-(r-20)/102*1.1;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;s+=`<circle cx="${(c+r*Math.cos(a)).toFixed(1)}" cy="${(c+r*Math.sin(a)).toFixed(1)}" r="${rad.toFixed(2)}" fill="#D9D3C6"/>`}}
  const N=28,R=48,done=score==null?0:Math.round(score*N);
  const mix=(t)=>{const A=[0xE8,0x79,0x4F],B=[0xF0,0xAA,0x75];return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")};
  for(let i=0;i<N;i++){const a=-Math.PI/2+i/N*Math.PI*2;s+=`<circle cx="${(c+R*Math.cos(a)).toFixed(1)}" cy="${(c+R*Math.sin(a)).toFixed(1)}" r="${i<done?3.8:2.4}" fill="${i<done?mix(i/N):"#E3DED3"}"/>`}
  return `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="${score==null?"Semaine pas commencée":"Semaine à "+Math.round(score*100)+" %"}">${s}</svg>`;
}
function chart(points,unit){
  if(points.length<2) return `<div class="empty"><span class="note">${points.length?`Une seule mesure pour l'instant : ${points[0].y} ${unit}. La courbe apparaît dès la deuxième.`:"Pas encore de mesure."}</span></div>`;
  const W=360,H=170,pl=36,pr=14,pt=14,pb=26;
  let lo=Math.min(...points.map(p=>p.y)),hi=Math.max(...points.map(p=>p.y));if(lo===hi){lo-=1;hi+=1}const padv=(hi-lo)*0.15;lo=Math.max(0,lo-padv);hi=hi+padv;
  const X=i=>pl+(W-pl-pr)*(i/(points.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const line=points.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join("");
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#D6D6D2"/><text x="${pl-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#7A7A76">${Math.round(v*2)/2}</text>`).join("");
  const last=points[points.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progression de ${points[0].y} à ${last.y} ${unit}">${ticks}<path d="${line}" fill="none" stroke="#E8794F" stroke-width="1.6"/>
   ${points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===points.length-1?5:2.5}" fill="${i===points.length-1?"#E8794F":"#fff"}" stroke="#E8794F" stroke-width="1.2"/>`).join("")}
   <text x="${pl}" y="${H-6}" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#7A7A76">${fmtShort(points[0].k)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" font-family="Hanken Grotesk, sans-serif" font-size="11" fill="#7A7A76">${fmtShort(last.k)} · ${last.y} ${unit}</text></svg>`;
}

 {id:"pont",t:"Pont & écarts",en:"Les deux objectifs visibles : les grands écarts et le pont complet. Deux séances par semaine, avec la force qui ouvre l'amplitude.",
  combien:"Lundi soir : force en fin d'amplitude, les deux écarts, puis le pont, 30 à 40 min. Samedi, juste après la muscu : les deux écarts, 5 à 25 min selon la semaine.",quand:"Le soir, ou juste après la muscu. Jamais dans l'heure avant un sport, jamais le matin.",
  comment:["Semaines 1 à 4 : positions détendues. 5 à 8 : contracter-relâcher doux, 20 à 30 % de ta force. Montée : isométrique, 3 répétitions, contractions de 4 s, dernière tenue de 10 puis 20 s. Progression : contractions fortes, dernière tenue de 30 s.", "Isométrique de Kurz : contracte, relâche, descends dans la seconde, recommence jusqu'à la limite, puis tiens la dernière contraction.", "Écart facial : papillon, assis jambes écartées, cavalier isométrique, puis l'écart au sol. Les adducteurs trop faibles sont le principal obstacle : d'où le balayage à l'élastique et le cavalier.", "Écart avant : la hanche arrière limite plus que les ischios. Douleur à l'os des fesses : on arrête.", "Pont : niveau suivant seulement sans pincement dans le bas du dos. L'arc vient du haut du dos et des hanches. On finit par quelques chat-vache doux."],

 {id:"dos",t:"Dos",en:"Le dos qui ne lâche jamais : les trois exercices de McGill, chaque jour, 10 minutes.",
  combien:"Tous les jours. Chat-vache 6 à 8 cycles, puis relevé de tête, pont latéral (chaque côté), chien de chasse (chaque côté) : tenues de 8 s, pyramide 5-3-1 puis 6-4-2, 20 à 30 s de repos entre les séries. On ajoute une répétition par série quand le lendemain va bien, jamais de la durée.",quand:"Entre le milieu de la matinée et le dîner. Jamais dans l'heure qui suit le réveil (disques gorgés d'eau : flexion 3 fois plus contrainte), ni juste avant de dormir. Les jours de sauts : juste avant la plio, ça rigidifie le tronc pour des heures.",
  comment:["Ventre légèrement contracté, comme avant un petit coup : 5 à 10 % de ta force, pas plus. Respire.", "Relevé de tête : mains sous le creux du dos, un genou plié, on soulève à peine. Pas d'abdos classiques, jamais : 3 300 N sur la colonne.", "Pont latéral : sur les genoux au début, sur les pieds ensuite. Chien de chasse : poing fermé, talon poussé loin, jamais plus haut que l'horizontal.", "Hygiène du dos : plier par les hanches, pas le dos ; debout toutes les 50 min ; porter à deux mains ; pas de torsion sous charge ; pas d'effort juste après être resté assis.", "Marche vive, bras qui balancent depuis les épaules : la thérapie numéro un du dos. 30 min quand tu peux, les trajets comptent.", "Plus difficile = version plus dure (coudes décollés, pieds, balayages, carrés), pas plus longue."],
  elite:"La règle de McGill pour les athlètes : tronc rigide, puissance des hanches. Les plus rapides sont ceux qui se relâchent le plus vite, avec un centre qui ne bouge pas. Les lanceurs, sprinteurs et combattants qu'il suit ouvrent chaque séance par ces trois exercices.",
  preuve:"L'endurance des muscles du dos protège, pas la force (449 hommes et 479 femmes suivis). Les hernies viennent de milliers de flexions répétées, même sous charge modeste. Les trois exercices ont réduit les blessures chez des gymnastes et des conscrits. Éviter la flexion le matin a suffi à réduire la douleur chez 85 patients. Les tenues restent courtes parce que l'oxygène des muscles du tronc chute en quelques secondes. Brukner & Khan : les exercices de stabilisation ne font pas mieux que l'exercice général, et le mal de dos récidivant va avec trop de gainage. On garde ces trois exercices pour l'endurance du tronc, pas pour se gainer en permanence : en courant, le tronc doit bouger.",

 {id:"course",t:"Course",en:"Trois sorties par semaine, les jours sans muscu : une facile, une de qualité, une longue. Le schéma des meilleurs coureurs, à ta dose.",
  combien:"À ton niveau, environ 2 h 30 et 22 à 28 km par semaine. Lundi : 35 à 40 min faciles, 6 à 8 km, avec 6 accélérations ou 6 à 8 sprints en côte. Mercredi : 40 à 50 min avec la partie dure, 7 à 9 km. Dimanche : 55 à 70 min faciles, 9 à 12 km. Jamais plus de 10 % de kilomètres en plus d'une semaine à l'autre.",quand:"Avant : 5 min de marche et des levés de jambe ; avant la qualité, 15 à 20 min d'échauffement. Après : 5 min de marche.",
  comment:["Facile = phrases entières, souffle 3 pas / 3 pas : 80 % de ton temps de course. L'erreur numéro un des amateurs : courir « moyen » tous les jours.", "Niveaux 1 et 2 : zéro intervalle pendant 16 semaines. D'abord 30 min en continu, puis accélérations et sprints en côte de 8 s.", "Niveau 3 : d'abord le seuil, puis le dur. Jamais plus vite que l'allure tenable 10 à 15 min.", "Le fractionné, c'est le mercredi, une seule fois par semaine. Il tourne sur 3 blocs de 4 semaines : d'abord vite (8 × 200 m), puis dur (4 × 4 min, la meilleure séance connue pour le cœur), puis allure soutenue (20 min).", "Sprints en côte : 6 à 8 montées de 8 à 10 s à fond, retour en marchant. Ça rend plus rapide et ça protège les tendons, sans fatiguer.", "Une deuxième séance dure dans la semaine ne fait pas progresser plus : elle fatigue et blesse.", "Pied posé sous le corps, pas de foulée trop longue. Ne force ni l'attaque avant-pied ni les chaussures minimalistes : 3 fois plus de blessures dans un essai.", "Niveau suivant seulement quand le bloc est devenu facile."],
  elite:"Les athlètes d'endurance font 80 % de leur temps facile et 20 % dur. Sur 48 athlètes, le schéma polarisé a donné les plus gros gains. Leurs coachs tiennent une charge 3 à 4 semaines et ne changent qu'une chose à la fois.",
  preuve:"Courir, même une fois par semaine moins de 50 min, baisse le risque de mort de 27 % (232 000 personnes). Le 4 × 4 min a augmenté le cardio maximal de 7 % en 8 semaines chez des coureurs entraînés. Chez 874 débutants, plus de 30 % de progression par semaine multipliait les blessures. Trois séances dures par semaine ont fait régresser des coureurs entraînés.",
  src:["daniels22", "fitz14", "magness14", "brukner17", "starrett14", "pedisic20", "helgerud07", "stoggl14", "nielsen14", "gabbett16"]},
 {id:"plyo",t:"Pliométrie",en:"Plus haut, plus loin, plus vite, plus fort des bras : une séance complète le vendredi, un jour sans muscu.",
  combien:"Vendredi, environ 40 min échauffement compris. Chaque séance mélange les sauts verticaux, en longueur et sur le côté, 4 à 6 sprints courts et 5 min de haut du corps (rotation, pompes explosives). Drop jumps une semaine sur deux, l'autre semaine sauts sur une jambe et bonds. Blocs de 6 semaines, la caisse monte de 30 à 60 cm. Le jeudi, 5 min de haut du corps en plus avant la muscu.",quand:"Après l'échauffement, jambes fraîches.",
  comment:["Drop jump : laisse-toi tomber de la caisse, ne saute pas. Atterris sur l'avant du pied et repars tout de suite : le sol est brûlant. Talon qui touche le sol : caisse trop haute.", "Tu montes la caisse de 10 cm seulement si tu sautes aussi haut qu'en saut vertical normal. Maximum 60 cm.", "Sauts à fond : 10 s entre deux sauts, 2 à 3 min entre les séries. La série s'arrête dès que la hauteur baisse.", "Atterris pieds droits, genoux au-dessus des orteils, jamais vers l'intérieur. Herbe, piste ou tapis, jamais le béton.", "Tendon du genou douloureux ce jour-là, ou pire le matin : pas de sauts.", "Le lendemain des drop jumps reste léger : course facile.", "Vise toujours une cible : toucher un repère haut, dépasser une ligne. Penser à la cible plutôt qu'à ses jambes fait sauter plus haut.", "Sprints : 15 à 20 m à 100 %, 2 min de marche entre deux. On cherche la vitesse, pas le cardio."],
  elite:"Verkhoshansky, l'inventeur des drop jumps, les réserve aux athlètes qui squattent 1,5 à 2 fois leur poids. En saison, il les place une fois tous les 10 à 14 jours, au moins 2 à 3 jours avant un entraînement technique, avec une journée légère le lendemain.",
  preuve:"Ce qui marche le mieux pour la détente : plus de 10 semaines, plus de 20 séances, plus de 50 sauts par séance, et un mélange de squat jumps, contre-mouvements et drop jumps ; ajouter du poids n'apporte rien (de Villarreal 2009). Pour la vitesse : plus de 80 sauts par séance, des sauts vers l'avant et des sprints (de Villarreal 2012). Le haut du corps répond aussi : lancers de médecine-ball +0,64 d'effet, force +0,39, avec 2 séances par semaine (Garcia-Carrillo 2023). Des sauts juste avant des sprints les rendent plus rapides, surtout chez les gens forts (Seitz & Haff 2016). Viser une cible fait sauter plus haut (Wulf 2007). En saison, une séance de sauts par semaine suffit pour un sport collectif (NSCA). Sauts et squat lourd combinés : +10,7 cm de détente en 6 semaines, contre +3,8 cm pour les sauts seuls. Sauter après la musculation est l'ordre le moins efficace (Supertraining). Une chute de 60 cm allonge déjà le contact au sol et charge plus le genou (Chu & Myer). Plus de 100 sauts à fond par séance n'est « ni productif ni sûr ».",
  src:["verkho09", "chu13", "nsca16", "brukner17", "adams", "markovic", "villarreal09", "villarreal12", "garcia23", "seitz16", "wulf07", "tack13", "ramirez20", "visnes13"]},
 {id:"froid",t:"Bain froid",en:"Ta piscine comme bain froid, deux fois par semaine, là où il aide sans freiner tes progrès.",

  elite:"Les pros l'utilisent après les matchs et en compétition, et le laissent de côté pendant les blocs où ils veulent progresser. Les Russes n'utilisaient pas le même moyen de récupération plus de 2 fois par semaine.",

    ${f.comment.length?`<div><span class="band-k">Comment</span><ul class="band-l">${f.comment.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`:""}
    ${f.id==="methode"?`<div class="phases" style="margin-top:4px">${week}</div><p class="note">Chaque jour, en plus : mobilité et méditation le matin, dos dans la journée, souplesse et les deux lectures le soir. Les semaines 6, 12 et 18, tout s'allège.</p>`:""}
    ${f.moves?`<div class="strip">${f.moves.filter((x,j,a)=>a.indexOf(x)===j).map(id=>`<button class="tcard${EXIMG[id]?" phc":""}" data-act="preview" data-v="${id}" aria-label="Aperçu : ${esc(EX[id].n)}">${thumb(id,52)}<span class="tn">${esc(EX[id].n)}</span></button>`).join("")}</div>`:""}
    <details class="srcd"><summary>Sources</summary><ul class="srcs">${f.src.map(s=>`<li><a href="${S[s][1]}" target="_blank" rel="noopener noreferrer">${esc(S[s][0])}</a></li>`).join("")}</ul></details>
   </div>`:""}</section>`}).join("")}${store.on?"":backupHTML()}</div>`;
}

    const fallback=()=>{ta.hidden=false;ta.value=data;ta.focus();ta.select();toast("Sélectionné : copie-le")};
    try{navigator.clipboard.writeText(data).then(()=>toast("Sauvegarde copiée"),fallback)}catch(e){fallback()}}
};
const CH={
  fbw(el){const k=ui.date,d=dayObj(k),v=num(el.value);if(v==null)delete d.v.poids;else d.v.poids=v;save("days",k);render(true)},
  fbset(el){fbSaveSet(el)},
  v(el){const k=ui.date,d=dayObj(k),id=el.dataset.id;const val=el.type==="time"?el.value:num(el.value);if(val==null||val==="")delete d.v[id];else d.v[id]=val;save("days",k);if(!typing())render()},
  lift(el){const k=ui.date,d=dayObj(k),ex=el.dataset.ex,i=Number(el.dataset.i),f=el.dataset.f;const arr=d.l[ex]=d.l[ex]||[];while(arr.length<=i)arr.push({});const val=num(el.value);if(val==null)delete arr[i][f];else arr[i][f]=val;save("days",k)},
  set(el){const P=state.profile,key=el.dataset.k;if(key==="weight"){P.weight=num(el.value)}else if(key==="semWeeks"){P.semWeeks=Math.max(1,num(el.value)||17)}else if(el.value){P[key]=el.value}save("profile");if(!typing())render()},
  course(el){const c=courseById(el.dataset.v);if(!c)return;const f=el.dataset.f;c[f]=f==="ects"||f==="hc"?num(el.value):el.value;save("profile");if(!typing())render()},
  book(el){state.profile.books[el.dataset.v]=el.value.trim();save("profile");if(!typing())render()},
  sport(el){state.profile[el.dataset.sp][el.dataset.v]=el.value.trim();save("profile");if(!typing())render()},
  sess(el){state.profile.sessions[el.dataset.v]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);save("profile")},
  liftex(el){ui.liftEx=el.value;render(true)}
};
const IN={jd(el){const wk=el.dataset.w;ui.jdraft[wk]=ui.jdraft[wk]||{};ui.jdraft[wk][el.dataset.f]=el.value}};
document.addEventListener("click",e=>{const xb=e.target.closest("[data-sx]");if(xb){e.preventDefault();SXA[xb.dataset.sx]&&SXA[xb.dataset.sx]();return}const mb=e.target.closest("[data-md]");if(mb){e.preventDefault();MDA[mb.dataset.md]&&MDA[mb.dataset.md](mb);return}const pb=e.target.closest("[data-pl]");if(pb){e.preventDefault();PLA[pb.dataset.pl]&&PLA[pb.dataset.pl]();return}const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener("change",e=>{const el=e.target.closest("[data-ch]");if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e)});
document.addEventListener("input",e=>{const el=e.target.closest("[data-in]");if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});

/* Cadran : glisser et clavier */
function dialSet(svg,v){
  v=Math.max(1,Math.min(10,v));const wk=svg.dataset.dial;ui.jdraft[wk]=ui.jdraft[wk]||{};ui.jdraft[wk].note=v;
  const ang=Math.PI-(v-1)/9*Math.PI,rot=90-ang*180/Math.PI;const g=svg.querySelector(".needle");g.setAttribute("transform",`rotate(${rot.toFixed(1)} 150 150)`);g.style.opacity=1;
  svg.setAttribute("aria-valuenow",v);const out=document.querySelector(`[data-dialval="${wk}"]`);if(out)out.textContent=v;
}
function dialFromEvent(svg,e){const r=svg.getBoundingClientRect(),sc=300/r.width;const x=(e.clientX-r.left)*sc,y=(e.clientY-r.top)*sc;let a=Math.atan2(150-y,x-150);if(a<0)a=x<150?Math.PI:0;dialSet(svg,Math.round(1+(Math.PI-a)/Math.PI*9))}
let dragDial=null;
document.addEventListener("pointerdown",e=>{const svg=e.target.closest("[data-dial]");if(!svg)return;dragDial=svg;try{svg.setPointerCapture(e.pointerId)}catch(_){}dialFromEvent(svg,e)});
document.addEventListener("pointermove",e=>{if(dragDial)dialFromEvent(dragDial,e)});
document.addEventListener("pointerup",()=>{dragDial=null});
document.addEventListener("keydown",e=>{const svg=e.target.closest&&e.target.closest("[data-dial]");if(!svg)return;const cur=Number(svg.getAttribute("aria-valuenow"))||5;if(["ArrowRight","ArrowUp"].includes(e.key)){e.preventDefault();dialSet(svg,cur+1)}if(["ArrowLeft","ArrowDown"].includes(e.key)){e.preventDefault();dialSet(svg,cur-1)}});

/* Changement de jour à minuit */
let lastToday=todayKey();setInterval(()=>{const t=todayKey();if(t!==lastToday){if(ui.date===lastToday)ui.date=t;lastToday=t;schedRender()}},60000);

render(true);
initDb();

/* ===== Version autonome (site) : sauvegarde des données + appli hors Claude ===== */
function backupHTML(){return `<section class="bk"><p class="bk-t">Tes données</p><p class="bk-n" id="bk-n">Elles sont enregistrées sur ce téléphone. Fais une sauvegarde de temps en temps.</p><div class="bk-b"><button class="btn" data-act="bksave">Sauvegarder mes données</button><button class="btn ghost" data-act="bkload">Restaurer une sauvegarde</button></div><input type="file" id="bk-file" accept=".json,application/json" hidden></section>`}
async function bkSave(){const name=`evolve-sauvegarde-${todayKey()}.json`,txt=JSON.stringify({app:"evolve",v:1,at:new Date().toISOString(),data:Object.assign({},state,{decks:userDecks()})});
  try{const f=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Sauvegarde Evolve"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function bkLoad(){const inp=document.getElementById("bk-file");if(!inp)return;inp.value="";
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const n=document.getElementById("bk-n");try{const j=JSON.parse(r.result),d=j&&j.data?j.data:j;if(!d||typeof d!=="object"||!d.profile)throw new Error("format");
      if(!confirm("Remplacer les données de ce téléphone par cette sauvegarde ?"))return;
      state.profile=normProfile(d.profile);for(const k of ["days","lectures","journal","srs"])state[k]=(d[k]&&typeof d[k]==="object")?d[k]:{};
      if(d.decks&&typeof d.decks==="object"&&Object.keys(d.decks).length)state.decks=d.decks;mergeBuiltin();
      persistLocal();persistDecks();render(true);const n2=document.getElementById("bk-n");if(n2)n2.textContent="Sauvegarde restaurée."}
      catch(e){if(n)n.textContent="Ce fichier n'est pas une sauvegarde Evolve."}};
    r.readAsText(f)};
  inp.click()}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(r=>{if(r.active)r.active.postMessage("warm")}).catch(()=>{})})}
</script>
