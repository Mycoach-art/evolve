<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Evolve</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Evolve"><meta name="theme-color" content="#151517"><meta name="robots" content="noindex,nofollow"><meta name="format-detection" content="telephone=no"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>.bk{margin:28px 0 48px;padding:18px;border-radius:18px;background:rgba(0,0,0,.045)}.bk-t{font-weight:700;margin:0 0 4px}.bk-n{margin:0 0 14px;opacity:.7;font-size:14px}.bk-b{display:flex;gap:10px;flex-wrap:wrap}</style></head><body>
<title>Evolve</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
/* Layout : une seule forme, le cercle. Jour = affiche noire (grille de cercles, titre bas), module = affiche papier avec cercle découpé, tableau de bord = page blanche et trame de points. */
:root{
  --paper:#F4EFE6; --white:#FFFFFF; --ink:#1A1A18; --ink2:#2A2A28; --muted:#857F74; --hair:#E2DCD0; --line:#C9C2B4; --soft:#FAF7F1;
  --bg:var(--paper); --surface:var(--white); --sunk:#E1E1DE; --accent:#E8794F; --on-accent:#FFFFFF; --accent-soft:#F8DED1; --good:#1A1A18; --warn:#7A7A76;
  --fig-near:#8C8C88; --fig-far:#D3D3CF; --fig-hl-far:#B0B0AB;
  --med-bg:#EEEFF9; --med-glow:#F7F7FD; --med-fg:#1A1A18; --med-muted:#7E82A8; --med-orb:#FFFFFF; --med-line:#CDD0E6; --med-acc:#5B63B7;
  --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif; --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --display:var(--sans); --mono:var(--sans); --med-serif:var(--serif);
  --cut:inset 18px 22px 40px -4px rgba(60,40,20,.16), inset -10px -12px 28px rgba(255,255,255,.95), 0 1px 0 rgba(255,255,255,.7);
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink);height:100%}
[hidden]{display:none!important}
body{font-family:var(--sans);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:10px 110px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:4px}
.mod:focus,.med:focus,.player:focus{outline:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow,.sub{font-size:12px;line-height:1.4;color:var(--muted)}
.sub{font-weight:500;color:var(--ink)}
.link{background:none;border:0;padding:0;font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.note{font-size:13.5px;line-height:1.5;color:var(--muted);max-width:62ch}
.note b{color:var(--ink);font-weight:600}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1;display:grid;place-items:center;padding:0;color:inherit}
.btn{font-size:13px;font-weight:500;border:1px solid var(--ink);border-radius:999px;padding:11px 16px;background:transparent;color:var(--ink);white-space:nowrap}
.btn.fill,.btn.acc{background:var(--ink);color:var(--white);border-color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:12.5px}
.btn.ghost{border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.pfoot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--muted)}
.in{font:inherit;font-size:15px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);width:100%;min-width:0;box-sizing:border-box}
.in.sm{padding:8px 6px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.ta{resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:transparent}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--white)}
.chip.dayc{width:34px;height:34px;padding:0;display:grid;place-items:center}
.sel{appearance:none;-webkit-appearance:none;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font:inherit;font-size:13px;color:var(--ink);max-width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:11px 4px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--white)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:7px;counter-reset:s}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14.5px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);font-size:12px;line-height:1.9;color:var(--muted);font-variant-numeric:tabular-nums}
.steps.plain li::before{content:"–"}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:7px 0;border-bottom:1px solid var(--hair)}
.tbl td:not(:first-child){text-align:right;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tbl td:first-child{font-size:14px}
.empty{border:1px solid var(--hair);border-radius:16px;padding:16px;display:grid;gap:10px;font-size:14px;background:var(--white)}
.g3{display:grid;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--white);font-size:13px;font-weight:500;padding:11px 16px;border-radius:999px;z-index:60}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.sync.sync-ok::before{background:var(--ink)}
.sync.sync-saving::before{background:var(--muted)}
.sync.sync-error::before,.sync.sync-readonly::before{background:transparent;border:1px solid var(--muted)}

/* Jour : affiche noire */
.j-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:8px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand i{font-style:normal;color:#E8794F}
.j-meta{font-size:12px;color:var(--muted);text-align:right}
.j-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:34px 0 0}
.c{position:relative;aspect-ratio:1;width:100%;border:0;background:transparent;padding:0;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.c svg{display:block;width:100%;height:100%}
.c .c-l{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(9.5px,2.7vw,11.5px);font-weight:600;letter-spacing:.01em;line-height:1.15;padding:8px;color:var(--on);pointer-events:none}
.c.future{opacity:.5}
.j-hint{margin-top:14px;font-size:12px;color:#8C8C88}
.j-wrap{display:flex;flex-direction:column;min-height:calc(100svh - 150px)}
.j-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto;padding-top:48px}
.j-day{font-size:clamp(56px,17vw,88px);font-weight:700;letter-spacing:-.045em;line-height:.86;text-transform:lowercase}
.j-date{font-size:15px;color:var(--muted);margin-top:10px}
.j-nav{display:flex;gap:8px;padding-bottom:6px}
.j-side{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;color:var(--muted);white-space:nowrap;letter-spacing:.02em;pointer-events:none}
@media (min-width:700px){.j-side{right:calc(50% - 296px)}}

/* Module : affiche papier */
.mod{position:fixed;inset:0;z-index:40;background:var(--paper);color:var(--ink);overflow-y:auto;overflow-x:hidden;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.mod-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));box-sizing:border-box;position:relative}
.m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.m-title{font-size:clamp(30px,8.5vw,40px);font-weight:700;letter-spacing:-.035em;line-height:1;text-wrap:balance}
.m-title::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mc);margin-right:10px;vertical-align:4px}
.m-hero{display:grid;place-items:center;padding:28px 0 10px}
.cut{width:min(64vw,300px);aspect-ratio:1;max-width:100%;border-radius:50%;border:0;background:color-mix(in srgb, var(--mc) 16%, var(--paper));box-shadow:var(--cut);display:grid;place-content:center;justify-items:center;gap:6px;color:var(--ink);text-align:center;padding:0;transition:transform .18s ease,background .25s ease,color .25s ease,box-shadow .25s ease}
.cut:active{transform:scale(.985)}
.cut .k{font-size:clamp(22px,6vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.cut .a{font-size:13px;color:var(--muted)}
.cut.on{background:var(--mc);color:var(--on);box-shadow:0 18px 40px -14px color-mix(in srgb, var(--mc) 70%, transparent)}
.cut.on .a{color:var(--on);opacity:.75}
.m-dose{text-align:center;font-size:14px;color:var(--muted);margin-top:14px;max-width:34ch;margin-inline:auto;text-wrap:balance}
.m-body{display:grid;gap:14px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.m-side{display:block;margin-top:28px;margin-left:auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;color:var(--mc);white-space:nowrap;align-self:flex-end}
.panel{display:contents}
.lift{display:grid;gap:7px;padding:12px 0;border-top:1px solid var(--hair)}
.lift:first-child{border-top:0;padding-top:0}
.lift-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lname{font-weight:600;font-size:15px}
.last{font-size:12px;color:var(--muted)}
.hint{font-size:12.5px;font-weight:500}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.set{display:grid;grid-template-columns:14px 1fr 10px 1fr;gap:4px;align-items:center}
.sn{font-size:11px;color:var(--muted)}
.x{font-size:12px;color:var(--muted);text-align:center}
.revrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--hair)}
.revrow:first-child{border-top:0}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0;color:var(--white);flex:none}
.chk.on{background:var(--ink)}
.chk.sm{width:24px;height:24px;border-width:1.3px}
.revt{font-size:14px;line-height:1.35}
.revt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tag{font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:999px;border:1px solid var(--ink);margin-left:6px;vertical-align:2px}
.psum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.psum-n{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.dose{font-size:12.5px;color:var(--muted)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tcard{flex:0 0 96px;scroll-snap-align:start;display:grid;justify-items:center;gap:3px;background:var(--white);border:1px solid var(--hair);border-radius:50%;aspect-ratio:1;padding:10px 6px;text-align:center;align-content:center}
.tcard svg{display:block;width:52px;height:52px}
.tcard.phc{border-radius:18px;aspect-ratio:auto;padding:4px 4px 8px;align-content:start;flex-basis:108px}
.tcard.phc img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#D9D9DB}
.rimg{display:flex;gap:4px;flex:none}
.rimg img{width:60px;height:60px;border-radius:12px;object-fit:cover;display:block;background:#D9D9DB}
.rimg.seq img{width:46px;height:46px}
.wstrip{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.wstrip img{width:74px;height:74px;border-radius:14px;object-fit:cover;flex:none;background:#D9D9DB}
.lift.wimg{grid-template-columns:64px 1fr;column-gap:12px}
.lift.wimg>*{grid-column:2}
.lift.wimg>.limg{grid-column:1;grid-row:1 / span 3;width:64px;height:64px;border-radius:14px;object-fit:cover;background:#D9D9DB}
.tcard .tn{font-size:10.5px;line-height:1.2;font-weight:500}
.tcard .td{font-size:10px;color:var(--muted)}
.levels{display:grid;gap:12px}
.lvrow{display:grid;gap:6px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lib .tcard{flex:none}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--white);border:1px solid var(--hair);border-radius:16px;padding:14px;color:var(--ink)}
.mcard .mo{color:var(--ink);display:grid}
.mcard .mt{display:grid;gap:2px;min-width:0}
.mcard .mn{font-weight:600;font-size:15px;line-height:1.25}
.mcard .md{font-size:12px;color:var(--muted)}
.mcard .mm{font-size:12.5px;white-space:nowrap;color:var(--muted)}
.mgrid{display:grid;gap:8px}

/* Journal */
.journal{display:grid;gap:12px}
.dialbox{display:grid;justify-items:center;background:var(--white);border-radius:20px;padding:14px 12px 10px}
.dial{width:100%;max-width:320px;height:auto;touch-action:none;cursor:grab;display:block}
.dialval{font-size:60px;font-weight:700;letter-spacing:-.04em;line-height:.9;margin-top:-6px}
.dialhint{font-size:11.5px;color:var(--muted)}
.done-list{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}

/* Tableau de bord */
.d-title{font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:-.01em;line-height:1;margin-top:10px}
.d-sub{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.d-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;font-size:13px;color:var(--muted)}
.d-halo{display:grid;place-items:center;margin:14px 0 6px}
.d-halo svg{width:min(70vw,290px);height:auto;display:block}
.d-big{font-size:clamp(56px,16vw,76px);font-weight:600;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums;color:#E8794F}
.d-big small{font-size:.5em;font-weight:500;letter-spacing:0;margin-left:3px}
.d-cap{font-size:13px;color:var(--muted);margin-top:8px}
.d-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.tile{background:var(--white);border:1px solid var(--hair);border-radius:16px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-size:17px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.section{margin-top:34px}
.section>h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:0;margin-bottom:12px}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--hair)}
.stat .k{font-weight:600;font-size:15px}
.stat .sv{font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.stat .sd{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.stat .sv{color:var(--muted)}
.stat.good .sv{color:var(--ink);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;height:120px;margin-top:8px;border-bottom:1px solid var(--ink)}
.bar{display:grid;justify-items:center;align-items:end;height:100%;position:relative}
.bar i{display:block;width:10px;border-radius:5px 5px 0 0;background:#F0AA75}
.bar.today i{background:#E8794F}
.bar.future i{background:var(--hair)}
.bar em{position:absolute;top:0;font-size:11px;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.barl{display:grid;grid-template-columns:repeat(7,1fr);margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center}
.year{display:grid;grid-template-columns:repeat(13,1fr);gap:6px}
.year i{display:block;aspect-ratio:1;border-radius:50%;border:1px solid var(--ink);box-sizing:border-box}
.year i.on{background:#E8794F;border-color:#E8794F}
.year i.cur{border-width:2.5px}
.year i.fut{border-color:var(--line)}
.year i.miss{border-color:var(--muted);border-style:dashed}
.phases{display:grid;border-top:1px solid var(--hair)}
.ph{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--hair)}
.ph .pn{font-weight:600}
.ph .pr{font-size:12.5px;color:var(--muted)}
.ph .pi{font-size:12px;color:var(--muted)}
.ph.cur .pi{color:var(--ink);font-weight:600}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--white);border:1px solid var(--hair);border-radius:16px;padding:14px}
.kpi b{display:block;font-size:34px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}

/* Méthode */
.p-title{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1;margin-top:10px}
.rules{display:grid;border-top:1px solid var(--line);margin-top:18px}
.rule{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:14px 0;border-bottom:1px solid var(--hair);font-size:14.5px;line-height:1.5}
.rule .rn{font-size:12px;line-height:1.7;color:var(--muted);font-variant-numeric:tabular-nums}
.rule small{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
details.proto{border-bottom:1px solid var(--hair)}
details.proto>summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:16px 0;cursor:pointer}
details.proto>summary::-webkit-details-marker{display:none}
details.proto>summary .pt{font-weight:600;font-size:19px;letter-spacing:-.015em}
details.proto>summary .pc{font-size:12.5px;color:var(--muted);text-align:right}
.pbody{display:grid;gap:14px;padding:0 0 24px;min-width:0}
.pbody p{margin:0;font-size:14.5px;line-height:1.6;max-width:62ch}
.pbody h4{margin:6px 0 0;font-size:13px;font-weight:600}
.dtab{width:100%;border-collapse:collapse;font-size:13.5px}
.dtab td{padding:8px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.dtab td:first-child{font-size:12.5px;color:var(--muted);width:34%;padding-right:10px}
.srcs{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.srcs a{font-size:12.5px;line-height:1.45;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* Méthode : bandes empilées */
.bands{margin:12px -16px 0;display:flex;flex-direction:column}
.band{background:var(--bb);border-radius:28px 28px 0 0;margin-top:-22px;padding:34px 24px 26px;position:relative;color:var(--ink)}
.band:first-child{margin-top:0}
.band:last-child{padding-bottom:150px;flex:1}
.band-h{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font-family:"Barlow Condensed","Hanken Grotesk",sans-serif;font-weight:800;font-size:42px;letter-spacing:.005em;text-transform:uppercase;line-height:1;color:inherit}
.band-h::after{content:none}
.band.open .band-h{margin-bottom:14px}
.band.open{padding-bottom:46px}
.band-b{display:grid;gap:10px;font-size:14.5px;line-height:1.5;max-width:60ch}
.band-b p{margin:0}
.band-b p b{font-weight:600}
.band-en{font-size:16px;line-height:1.45;font-weight:500}
.band-l{margin:0;padding:0 0 0 18px;display:grid;gap:5px}
.band .tcard{background:rgba(255,255,255,.55);border-color:transparent}
.srcd summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none}
.srcd summary::-webkit-details-marker{display:none}
.srcd[open] summary{margin-bottom:8px}
.srcd .srcs a{color:var(--ink)}

/* Réglages */
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.course{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--hair)}
.course .cg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.course .cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hrow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--hair)}
.hrow .hn{font-weight:600;font-size:14.5px}
.toggle{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.toggle .tn{font-weight:600}
.toggle .td{font-size:12.5px;color:var(--muted)}
.sw{width:46px;height:28px;border-radius:999px;border:1px solid var(--ink);background:transparent;position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .18s}
.sw.on{background:var(--ink)}
.sw.on::after{transform:translateX(18px);background:var(--white)}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--hair);padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:11px 2px 9px;display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.tab svg{width:26px;height:26px;display:block}
.tab.on{color:var(--ink)}

/* Lecteur de souplesse */
.player{position:fixed;inset:0;z-index:50;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.pl-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px 16px;box-sizing:border-box}
.pl-top{display:flex;align-items:center;gap:10px}
.pl-top .eyebrow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-snd{font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:transparent;color:var(--ink);white-space:nowrap}
.pl-prog{display:flex;gap:2px;height:3px}
.pl-prog span{flex:1;background:var(--hair);position:relative;overflow:hidden;border-radius:2px}
.pl-prog span.rest{flex:.5}
.pl-prog span.done{background:var(--ink)}
.pl-prog span i{position:absolute;inset:0 auto 0 0;width:0;background:#9A9FDE}
.pl-prog.dense{gap:1px}
.pl-stage{width:min(78vw,330px);aspect-ratio:1;max-width:100%;margin:6px auto;background:var(--white);border-radius:50%;box-shadow:var(--cut);display:block;flex:none}
.pl-stage canvas{width:100%;height:100%;display:block;border-radius:50%}
.pl-stage{position:relative}
.pl-stage .pl-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;transition:opacity .25s}
.pl-stage.photo{border-radius:30px;overflow:hidden;background:#fff}
.pl-stage.photo.tall{aspect-ratio:3/4;width:min(66vw,292px);background:#C3C7CA;border-radius:26px}
.pl-stage .pl-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;transition:opacity .25s}
.pl-stage.photo.vid{aspect-ratio:9/16;width:min(52vw,226px);background:#C3C7CA;border-radius:24px}
.pl-stage.photo.vid .pl-vid{display:block}
.pl-stage.photo.vid .pl-img{display:none}
.pl-vid.flip{transform:scaleX(-1)}
.pl-vid.dim{opacity:.4}
.pl-stage.photo .pl-img{display:block}
.pl-stage.photo canvas{visibility:hidden}
.pl-img.flip{transform:scaleX(-1)}
.pl-img.dim{opacity:.4}
.pl-info{display:grid;gap:4px}
.pl-tags{font-size:12px;font-weight:500;min-height:16px}
.pl-name{margin:0;font-size:clamp(28px,8vw,38px);font-weight:700;line-height:1;letter-spacing:-.03em;text-wrap:balance}
.pl-target{font-size:12.5px;color:var(--muted)}
.pl-cue{margin:4px 0 0;font-size:15px;line-height:1.5;max-width:58ch;min-height:45px}
.pl-cue.hot{font-weight:600}
.pl-bottom{display:grid;gap:10px;justify-items:center;margin-top:auto}
.pl-timerbox{display:flex;align-items:baseline;justify-content:center;gap:4px}
.pl-timer{font-size:clamp(68px,20vw,100px);font-weight:600;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.pl-unit{font-size:16px;color:var(--muted)}
.pl-ctrl{display:flex;align-items:center;gap:22px}
.pl-ctrl button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center}
.pl-ctrl #pl-play{width:72px;height:72px;background:#9A9FDE;border-color:#9A9FDE;color:#fff}
.pl-start{font-size:14px;padding:16px 26px}
.pl-next{font-size:12.5px;color:var(--muted);text-align:center}
.pl-done{flex:1;display:grid;align-content:center;justify-items:center;gap:14px;text-align:center}
.pl-done .big{font-family:var(--serif);font-weight:400;font-size:clamp(56px,18vw,96px);line-height:.9}

/* Méditation */
.med{position:fixed;inset:0;z-index:50;background:var(--med-bg);color:var(--med-fg);overflow:hidden}
.med-bg{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 34%,var(--med-glow),var(--med-bg) 70%)}
.md-blob{display:none}
.med-in{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto auto;box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.md-top{display:flex;align-items:center;gap:8px}
.md-top .ib{border-color:var(--med-line);color:var(--med-fg);flex:none}
.md-title{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--med-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.md-pill{font-size:12px;font-weight:500;border:1px solid var(--med-line);border-radius:999px;padding:8px 12px;background:transparent;color:var(--med-fg);white-space:nowrap}
.md-pill.off{color:var(--med-muted);text-decoration:line-through;text-decoration-thickness:1px}
.md-hero{display:grid;place-items:center;min-height:0}
.med.mz{background:linear-gradient(180deg,#A47A69 0%,#B77A6B 38%,#C98470 70%,#D9A384 100%);color:#fff;display:grid;grid-template-rows:auto 1fr auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 22px);overflow:hidden;font-family:var(--sans)}
.mz-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:44px;transition:opacity .5s}
.mz-back{width:44px;height:44px;border:0;background:transparent;color:rgba(255,255,255,.78);display:grid;place-items:center;padding:0;border-radius:50%}
.mz-title{text-align:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.01em}
.mz-stage{display:grid;align-content:center;justify-items:center;min-height:0;transition:opacity .5s}
.mz-orb{position:relative;width:min(72vw,310px);aspect-ratio:1;margin-bottom:30px}
.mz-orb>*{position:absolute;left:50%;top:50%;width:100%;height:100%;border-radius:50%;transform:translate(-50%,-50%) scale(.5);will-change:transform,opacity;backface-visibility:hidden}
.mz-orb .disc:nth-of-type(1){background:rgba(236,209,193,.52)}
.mz-orb .disc:nth-of-type(2){background:rgba(240,219,206,.66)}
.mz-orb .disc:nth-of-type(3){background:rgba(243,228,218,.8)}
.mz-orb .disc:nth-of-type(4){background:rgba(244,235,228,.92)}
.mz-orb .disc.core{background:radial-gradient(circle at 50% 42%,#DFE6E9 0%,#D2DBDF 70%,#CAD4D9 100%);box-shadow:0 0 30px rgba(255,255,255,.25)}
.mz-orb .ring{border:1.5px solid rgba(255,255,255,.75);background:transparent;opacity:0}
.mz-ph{font-size:28px;font-weight:700;letter-spacing:-.01em;color:#fff;min-height:36px;line-height:1.25;text-shadow:0 1px 14px rgba(110,50,35,.16)}
.mz-ph.mzin{animation:mzin .7s ease}
@keyframes mzin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.mz-time{margin-top:6px;font-size:14px;font-weight:500;color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mz-btn{width:100%;height:54px;border:0;border-radius:10px;background:#F4F0ED;color:#2B2422;font:inherit;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 30px -16px rgba(80,30,20,.5);transition:opacity .5s,transform .15s}
.mz-btn:active{transform:scale(.985)}
.mz-btn svg{width:17px;height:17px}
.mz-bravo{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;opacity:0;transition:opacity .7s ease;pointer-events:none}
.mz-bravo.show{opacity:1}
.mz-bravo .bv{font-size:48px;font-weight:700;letter-spacing:-.02em;transform:scale(.9);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.mz-bravo.show .bv{transform:scale(1)}
.mz-bravo .bs{font-size:15px;font-weight:500;color:rgba(255,255,255,.82)}
.med.mz.mzdone .mz-stage,.med.mz.mzdone .mz-btn,.med.mz.mzdone .mz-top{opacity:0}
.med{--k1:#6E76D8;--k2:#A9B2FF;--k3:#E4E7FF;--b:0}
.med[data-k="sigh"]{--k1:#5B63B7;--k2:#9AA3F5;--k3:#E2E5FF}
.med[data-k="breath"]{--k1:#6E76D8;--k2:#A9B2FF;--k3:#E4E7FF}
.med[data-k="open"]{--k1:#4FA7C9;--k2:#93D6E6;--k3:#DDF3F7}
.med[data-k="lk"]{--k1:#E07A6A;--k2:#F4B183;--k3:#FBE3D2}
.med[data-k="intent"]{--k1:#D99A3A;--k2:#F0C978;--k3:#FBEFD6}
.med[data-k="calm"]{--k1:#8B8FC9;--k2:#C3C7F0;--k3:#EEEFFB}
.med-bg{transition:background .8s}
.md-orb{position:relative;width:min(58vw,250px);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;will-change:transform;background:transparent}
.md-orb::before,.md-orb::after{display:none}
.md-halo{position:absolute;inset:-38%;border-radius:50%;background:radial-gradient(circle,var(--k2) 0%,transparent 62%);opacity:calc(.28 + var(--b) * .42);filter:blur(14px);transition:opacity .4s}
.md-swirl{position:absolute;inset:4%;border-radius:50%;background:conic-gradient(from 0deg,var(--k1),var(--k2),var(--k3),var(--k2),var(--k1));filter:blur(16px);opacity:.75;animation:mdspin 26s linear infinite}
.md-swirl.s2{inset:14%;opacity:.55;animation-duration:17s;animation-direction:reverse;background:conic-gradient(from 120deg,var(--k3),var(--k1),var(--k2),var(--k3))}
.md-ring{position:absolute;inset:2%;border-radius:50%;border:1.5px solid var(--k1);opacity:0;pointer-events:none}
.med[data-k="open"] .md-ring{animation:mdripple 7.5s ease-out infinite}
.med[data-k="open"] .md-ring.r2{animation-delay:2.5s}
.med[data-k="open"] .md-ring.r3{animation-delay:5s}
.med[data-k="lk"] .md-halo{animation:mdwarm 5.5s ease-in-out infinite}
@keyframes mdspin{to{transform:rotate(360deg)}}
@keyframes mdripple{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.75);opacity:0}}
@keyframes mdwarm{0%,100%{filter:blur(14px) brightness(1)}50%{filter:blur(20px) brightness(1.12)}}
.md-core{position:relative;z-index:1;width:54%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 30%,#FFFFFF 0%,var(--k3) 46%,var(--k2) 100%);display:grid;place-content:center;justify-items:center;color:#1A1A2E;text-align:center;box-shadow:0 14px 40px -14px var(--k1),inset 0 -6px 18px -8px var(--k1)}
@media (prefers-reduced-motion: reduce){.md-swirl,.md-ring,.md-halo{animation:none!important}}
.md-ph{font-size:11px;font-weight:500;letter-spacing:.04em;min-height:14px;color:var(--med-muted)}
.md-cnt{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-height:44px}
.md-text{display:grid;gap:10px;justify-items:center;text-align:center;padding:8px 0 18px;min-height:150px;align-content:start}
.md-step{font-size:12px;font-weight:500;color:var(--med-muted)}
.md-say{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(20px,5.4vw,25px);line-height:1.4;max-width:30ch;text-wrap:balance}
.md-say.fade{animation:mdin .9s ease}
@keyframes mdin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.md-foot{display:grid;gap:14px}
.md-bar{height:2px;background:var(--med-line);border-radius:2px;overflow:hidden}
.md-bar{display:flex;gap:3px;height:4px;background:transparent;overflow:visible}
.md-bar span{display:block;height:100%;background:var(--med-line);border-radius:3px;overflow:hidden;min-width:2px}
.md-bar span i{display:block;height:100%;width:0}
.md-plan{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:12px;color:var(--med-muted);margin-bottom:4px}
.md-plan span{display:inline-flex;align-items:center;gap:6px}.md-plan i,.mp-leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.md-done-orb{position:relative;width:120px;height:120px;margin-bottom:6px}
.md-done-orb::before{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,#F4B183 0%,transparent 62%);opacity:.55;filter:blur(10px)}
.md-done-orb span{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff 0%,#FBE3D2 48%,#F4B183 100%);box-shadow:0 14px 36px -12px #E07A6A;animation:mcbreath 9s ease-in-out infinite}
.md-rate{display:grid;gap:10px;width:min(100%,340px);margin:6px 0 8px}
.md-rate .rq{font-size:13px;color:var(--med-muted)}
.md-rate .rr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:left}
.md-rate .rr span{font-size:14px;font-weight:500}
.md-rate .rr div{display:flex;gap:6px}
.md-rate button{width:38px;height:38px;border-radius:50%;border:1px solid var(--med-line);background:transparent;color:var(--med-fg);font:inherit;font-size:14px}
.md-rate button.on{background:var(--med-acc);border-color:var(--med-acc);color:#fff}
.medcut{position:relative;width:min(64vw,300px);aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0;color:#1A1A2E;--k1:#6E76D8;--k2:#A9B2FF;--k3:#E4E7FF;cursor:pointer}
.medcut.on{--k1:#E07A6A;--k2:#F4B183;--k3:#FBE3D2}
.medcut .mc-halo{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,var(--k2) 0%,transparent 64%);opacity:.5;filter:blur(12px);animation:mcbreath 11s ease-in-out infinite}
.medcut .mc-swirl{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(from 0deg,var(--k1),var(--k2),var(--k3),var(--k2),var(--k1));filter:blur(14px);opacity:.8;animation:mdspin 30s linear infinite}
.medcut .mc-core{position:relative;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff 0%,var(--k3) 50%,var(--k2) 100%);display:grid;place-content:center;justify-items:center;gap:6px;box-shadow:0 16px 40px -16px var(--k1);animation:mcbreath 11s ease-in-out infinite}
.medcut .k{font-size:clamp(24px,6.4vw,32px);font-weight:700;letter-spacing:-.03em;line-height:1}
.medcut .a{font-size:13px;color:#5D6190}
.medcut:active .mc-core{transform:scale(.97)}
@keyframes mcbreath{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.mp-card{background:var(--white);border:1px solid var(--hair);border-radius:18px;padding:14px 14px 12px;display:grid;gap:10px}
.mp-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}.mp-h b{font-size:15px;color:var(--ink)}
.mp-bar{display:flex;gap:3px;height:10px}.mp-bar span{border-radius:5px;min-width:3px}
.mp-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}.mp-leg span{display:inline-flex;align-items:center;gap:6px}
.mp-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mp-tiles div{background:var(--white);border:1px solid var(--hair);border-radius:16px;padding:12px 10px;display:grid;gap:2px;text-align:center}
.mp-tiles b{font-size:20px;font-weight:700;letter-spacing:-.02em}.mp-tiles small{font-size:12px;font-weight:500;color:var(--muted)}.mp-tiles span{font-size:11.5px;color:var(--muted)}
.mp-mood{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mp-mood div{background:var(--white);border:1px solid var(--hair);border-radius:16px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline}
.mp-mood span{font-size:12.5px;color:var(--muted)}.mp-mood b{font-size:18px}.mp-mood small{font-size:11px;color:var(--muted)}.mp-mood em{grid-column:1/-1;font-style:normal;font-size:11.5px;color:var(--muted)}
.mp-path{display:flex;align-items:flex-start;justify-content:space-between;position:relative;margin-top:8px;padding:0 4px}
.mp-path::before{content:"";position:absolute;left:14px;right:14px;top:7px;height:2px;background:var(--hair)}
.mp-path span{position:relative;display:grid;justify-items:center;gap:6px;z-index:1}
.mp-path i{width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--hair)}
.mp-path span.done i{background:#A9B2FF;border-color:#A9B2FF}.mp-path span.cur i{background:#5B63B7;border-color:#5B63B7;box-shadow:0 0 0 5px rgba(91,99,183,.18)}
.mp-path em{font-style:normal;font-size:11.5px;color:var(--muted)}.mp-path span.cur em{color:var(--ink);font-weight:600}
.mcard.mc2{border-radius:18px}
.mcard.today{border-color:#E9C27A;box-shadow:0 8px 24px -16px #D99A3A}
.mcard .mtag{font-style:normal;font-size:11px;font-weight:600;color:#9A6A12;background:#FBEFD6;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.mini{width:40px;height:40px;border-radius:50%;position:relative;display:block}
.mini i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,var(--k1),var(--k2),var(--k3),var(--k1));filter:blur(3px)}
.mini::after{content:"";position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff,var(--k3))}
.mini.k-open{--k1:#4FA7C9;--k2:#93D6E6;--k3:#DDF3F7}.mini.k-intent{--k1:#D99A3A;--k2:#F0C978;--k3:#FBEFD6}
@media (prefers-reduced-motion: reduce){.medcut *,.md-done-orb span{animation:none!important}}
.md-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.md-time{font-size:12.5px;color:var(--med-muted);font-variant-numeric:tabular-nums}
.md-time.r{text-align:right}
.md-ctrl{display:flex;align-items:center;justify-content:center;gap:18px}

/* Souplesse du soir : séance guidée façon coach, fond blanc */
.sx{position:fixed;inset:0;z-index:55;background:#fff;color:#151515;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 26px);overflow:hidden;font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.sx[hidden]{display:none}
.sx-bar{display:flex;gap:3px;height:3px}
.sx-bar i{flex:1;border-radius:2px;background:#EDEDED;position:relative;overflow:hidden}
.sx-bar i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#151515;border-radius:2px}
.sx-top{display:flex;align-items:center;height:46px}
.sx-x{width:44px;height:44px;margin-left:-11px;border:0;background:transparent;color:#A3A3A3;display:grid;place-items:center;border-radius:50%;padding:0}
.sx-fig{position:relative;min-height:0}
.sx-l{position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.sx-l.sx-on{opacity:1}
.sx-l.sx-flip{transform:scaleX(-1)}
.sx-b{position:absolute;inset:0;transform-origin:50% 86%;transform:translateY(calc(var(--br,0) * -3px)) scale(calc(1 + var(--br,0) * .014));will-change:transform}
.sx-b .sx-st{position:absolute;left:8%;top:6%;width:84%;height:84%}
.sx-b img,.sx-b video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 72%;display:block}
.sx-b .sx-mu{opacity:calc(var(--gl,0) * .7)}
.sx-mode{justify-self:center;display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:7px 13px 7px 10px;border-radius:999px;background:rgba(21,21,21,.06);font-size:13px;line-height:1.25;max-width:100%}
.sx-mode svg{flex:none;width:16px;height:16px}
.sx-mode b{font-weight:700;white-space:nowrap}
.sx-mode span{color:rgba(21,21,21,.62)}
.sx-mode[data-k="fast"] svg{color:#E5322B}
.sx.mob .sx-mode{background:rgba(255,255,255,.5)}
.sx-name{display:flex;justify-content:center;align-items:center;gap:10px;min-height:24px;margin:8px 0 10px;font-size:17px;font-weight:600;letter-spacing:-.01em;text-align:center}
.sx-dots{display:inline-flex;gap:5px}
.sx-cue{justify-self:center;max-width:36ch;margin:-4px 0 12px;min-height:2.7em;text-align:center;font-size:14px;line-height:1.35;color:rgba(21,21,21,.68);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .35s ease}
.sx-cue.sx-fade{opacity:0}
.sx-dots i{width:6px;height:6px;border-radius:50%;background:#DCDCDC}
.sx-dots i.sx-don{background:#151515}
.sx-ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center}
.sx-nav{width:52px;height:52px;border:0;background:transparent;color:#BDBDBD;display:grid;place-items:center;border-radius:50%;padding:0}
.sx-nav:active{color:#151515}
.sx-go{position:relative;width:112px;height:112px;border-radius:50%;border:0;padding:0;background:#151515;color:#fff;font:inherit;display:grid;place-items:center;box-shadow:0 20px 40px -24px rgba(0,0,0,.6);transition:transform .15s,background .35s,color .35s,box-shadow .35s}
.sx-go:active{transform:scale(.965)}
.sx-rg{position:absolute;left:-9px;top:-9px;width:130px;height:130px;transform:rotate(-90deg);pointer-events:none;overflow:visible}
.sx-tr{stroke:#EFEFEF}
.sx-pgc{stroke:#E5322B;transition:stroke .35s}
.sx-c{display:grid;justify-items:center;line-height:1;transition:opacity .25s}
.sx-n{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sx-u{font-size:12px;font-weight:600;opacity:.55;margin-top:4px;min-height:12px;font-variant-numeric:tabular-nums}
.sx-u:empty{display:none}
.sx-go[data-st="idle"] .sx-n{font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.sx-go[data-st="prep"]{background:#fff;color:#151515;box-shadow:inset 0 0 0 1.5px #E4E4E4}
.sx-go[data-st="prep"] .sx-pgc{stroke:#B8B8B8}
.sx-pi{position:absolute;inset:0;display:none;place-items:center;color:inherit}
.sx-go.sx-pz .sx-c{opacity:0}
.sx-go.sx-pz .sx-pi{display:grid}
.sx-bravo{position:absolute;inset:0;background:#fff;display:grid;place-content:center;justify-items:center;gap:8px;opacity:0;transition:opacity .6s ease}
.sx-bravo.sx-show{opacity:1}
.sx-bv{font-size:46px;font-weight:700;letter-spacing:-.02em;transform:scale(.92);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.sx-bravo.sx-show .sx-bv{transform:none}
.sx-bs{font-size:15px;color:#8F8F8F}
@media (prefers-reduced-motion:reduce){.sx-l{transition:none}.sx-b{transform:none}}

/* Pages d'exercices : plus de grosse bulle, une carte claire par mouvement */
.m-key{align-self:flex-start;margin:10px 0 0;padding:6px 13px;border-radius:999px;background:var(--mc);color:var(--on);font-size:14px;font-weight:700;letter-spacing:-.005em}

.xs-h{margin:18px 0 0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.xl{display:grid;gap:14px}
.xc{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03),0 18px 36px -30px rgba(40,24,12,.55)}
.xc-im{display:flex;height:min(56vw,250px);background:#fff;padding:12px 8px 0}
.xc-im img{flex:1 1 0;min-width:0;width:100%;height:100%;object-fit:contain}
.xc-b{padding:12px 16px 16px}
.xc-h{display:flex;gap:10px;align-items:flex-start}
.xc-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--mc);color:var(--on);font-size:13px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

.xc-d{margin:9px 0 0;font-size:14px;line-height:1.4}
.xc-d b{font-weight:700}
.xc-d span{color:var(--muted)}
.xc-x{margin:7px 0 0;font-size:14.5px;line-height:1.5;color:#45403B}
.xw .xc-im{height:auto;gap:8px;overflow-x:auto;padding:12px 12px 0;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.xw .xc-im img{flex:0 0 88px;width:88px;height:88px;border-radius:14px;background:#F6F5F3;scroll-snap-align:start}
.m-body .steps{background:rgba(255,255,255,.6);border-radius:20px;padding:14px 16px}
.xnote{margin-top:2px}
.m-act{position:sticky;bottom:0;z-index:3;margin:24px -18px 0;padding:16px 18px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(0,0,0,0),var(--paper) 40%)}
.m-go{display:block;width:100%;height:56px;border:0;border-radius:999px;background:#151515;color:#fff;font:inherit;font-size:16px;font-weight:600;letter-spacing:-.01em;box-shadow:0 16px 30px -18px rgba(0,0,0,.55);transition:transform .15s ease,background .25s ease}
.m-go:active{transform:scale(.98)}
.m-go.on{background:var(--mc);color:var(--on)}
/* v29 : la Mobilité dans le lecteur de la Souplesse, sur le gris des images */
.sx.mob{background:var(--mobbg,#BEC2C6);transition:background-color .5s ease}
.sx.mob .sx-bar i{background:rgba(21,21,21,.1)}
.sx.mob .sx-x{color:#4B5054}
.sx.mob .sx-nav{color:#666C71}
.sx.mob .sx-nav:active{color:#151515}

.sx.mob .sx-dots i{background:rgba(21,21,21,.18)}

.sx.mob .sx-bravo{background:var(--mobbg,#BEC2C6)}
.sx.mob .sx-bs{color:#4B5054}

.sx.mob .sx-fig{position:static}
.sx.mob .sx-b img,.sx.mob .sx-b .sx-st{transition:opacity .6s ease}
.sx.mob .sx-rel .sx-b img,.sx.mob .sx-rel .sx-b .sx-st{opacity:.45}
.sx.mob .sx-l{z-index:0}

.sx.mob .sx-b img,.sx.mob .sx-b video{object-fit:cover;object-position:50% 50%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent),linear-gradient(180deg,transparent,#000 5%,#000 93%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent),linear-gradient(180deg,transparent,#000 5%,#000 93%,transparent);mask-composite:intersect}


/* Jour v19 : la roue. Fond graphite, un pétale par module, blanc = fait. */
html.jx,body.jx{background:#161517}
body.jx{color:#F4F1EE}
body.jx .tabs{background:rgba(22,21,23,.78);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border-top-color:rgba(255,255,255,.06)}
body.jx .tab{color:rgba(255,255,255,.38)}
body.jx .tab.on{color:#fff}
.jx-wrap{position:relative;display:flex;flex-direction:column;min-height:calc(100svh - 118px);touch-action:pan-y}
.jx-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:8px;position:relative;z-index:2}
.jx-head .brand{color:#fff}
.jx-meta{font-size:12px;color:rgba(255,255,255,.42);text-align:right;letter-spacing:.01em}
.jx-stage{flex:1;display:grid;align-content:center;justify-items:center;padding:14px 0 6px;position:relative}
.jx-wheelbox{--w:min(calc(100vw - 16px),500px);position:relative;width:var(--w);margin-inline:calc((100% - var(--w)) / 2);aspect-ratio:1}
html.jx,body.jx{overflow-x:clip}
.jx-aura{position:absolute;inset:-14%;border-radius:50%;background:conic-gradient(from 0deg,#C98470,#8C6FB8,#4E6FA8,#D9A384,#B77A6B,#C98470);filter:blur(56px);opacity:calc(.10 + var(--sc,0) * .34);animation:jxspin 46s linear infinite;pointer-events:none;transition:opacity 1.2s ease}
@keyframes jxspin{to{transform:rotate(360deg)}}
.jx-svg{position:relative;display:block;width:100%;height:100%;overflow:visible;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.jx-p{cursor:pointer;outline:none;transform-box:view-box;transform-origin:200px 200px;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .4s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.jx-p .jx-t{fill:url(#jxTrack);stroke:url(#jxTrack);stroke-width:28;stroke-linejoin:round}
.jx-p .jx-f{fill:url(#jxPearl);stroke:url(#jxPearl);stroke-width:28;stroke-linejoin:round;transform-box:view-box;transform-origin:200px 200px;transform:scale(var(--k,0));opacity:var(--o,0);transition:transform .75s cubic-bezier(.2,.95,.25,1.05),opacity .4s}
.jx-p text{font-family:var(--sans);text-anchor:middle;pointer-events:none;transition:fill .45s}
.jx-p .jx-l{font-size:var(--fs,12px);font-weight:600;fill:rgba(255,255,255,.86);letter-spacing:.005em}
.jx-p .jx-k{font-size:calc(var(--fs,12px) * .78);font-weight:500;fill:rgba(255,255,255,.44);font-variant-numeric:tabular-nums}
.jx-p.jx-done .jx-l{fill:#2A2630}
.jx-p.jx-done .jx-k{fill:rgba(42,38,48,.55)}
.jx-p:active,.jx-p.jx-hold{transform:scale(.955)}
.jx-p.jx-hold{transition:transform .5s ease}
.jx-p:focus-visible .jx-t{stroke:rgba(255,255,255,.5)}
.jx-fut .jx-p{opacity:.5}
.jx-in .jx-p{animation:jxin .8s cubic-bezier(.16,.9,.25,1) backwards;animation-delay:calc(var(--i) * 45ms)}
@keyframes jxin{from{opacity:0;transform:scale(.55) rotate(-14deg)}to{opacity:1;transform:none}}
.jx-p.jx-pop{animation:jxpop .6s cubic-bezier(.2,.9,.25,1)}
@keyframes jxpop{40%{transform:scale(1.035)}100%{transform:none}}
.jx-core{fill:rgba(255,255,255,.08);transition:fill .8s}
.jx-all .jx-core{fill:#fff}
.jx-glow{opacity:0;transition:opacity 1s}
.jx-all .jx-glow{opacity:1}
.jx-foot{text-align:center;padding:4px 0 8px;position:relative;z-index:2}
.jx-title{margin:0;background:none;border:0;padding:0;color:#fff;font-size:clamp(46px,13vw,64px);font-weight:700;letter-spacing:-.045em;line-height:1}
.jx-sub{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:14px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.jx-nav{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:rgba(255,255,255,.45);display:grid;place-items:center;padding:0}
.jx-nav:active{color:#fff;background:rgba(255,255,255,.08)}


.jx-edit{margin-top:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:rgba(255,255,255,.82);border-radius:999px;font:inherit;font-size:13.5px;font-weight:600;padding:9px 16px}
.dx{--rc:#F4F1EC;z-index:54}
.dx-t{margin:18px 0 0;text-align:center;font-size:26px;font-weight:700;letter-spacing:-.02em}
.dx-seg{margin-top:16px;width:min(100%,360px)}
.dx-p{margin:12px auto 0;max-width:34ch;text-align:center;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.55)}
.dx-h{margin:24px 0 8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.5)}
.dx-list{display:grid;gap:6px}
.dx-row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:12px;border:0;border-radius:16px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);font:inherit;font-size:16px;text-align:left;padding:13px 14px;min-height:52px}
.dx-row i{width:10px;height:10px;border-radius:50%;opacity:.45}
.dx-row.on{background:rgba(255,255,255,.08);color:#fff;font-weight:600}
.dx-row.on i{opacity:1}
.dx-sw{width:46px;height:28px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;transition:background .2s}
.dx-sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}

@media (prefers-reduced-motion:reduce){.dx-sw,.dx-sw::after{transition:none}}
.jx-hint{margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.32)}
@media (prefers-reduced-motion:reduce){.jx-aura{animation:none}.jx-in .jx-p{animation:none}.jx-p .jx-f{transition:none}}

/* Muscu v23 : carnet de salle. Fond acier ; chaque séance a la couleur d'un disque olympique
   (rouge 25 kg = A lourd, bleu 20 = B, jaune 15 = C, vert 10 = D). Chiffres en Barlow Condensed. */
.mod.fbmod{background:#ECEEF1}
.mod.fbmod .m-body{border-top:0;margin-top:4px;padding-top:0}
.fb{--fi:#15181D;--fm:#69707A;--fl:#D8DCE1;--fc:#FFFFFF;display:grid;gap:18px;min-width:0;color:var(--fi)}
.fb>*{min-width:0}
.fbh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:end}
.fbh-n{display:grid}
.fbh-n small{font-size:12px;color:var(--fm)}
.fbh-n div{display:flex;align-items:baseline;gap:2px;line-height:.82}
.fbh-n b{font-family:"Barlow Condensed",var(--sans);font-weight:800;font-size:92px;letter-spacing:-.03em}
.fbh-n i{font-style:normal;font-family:"Barlow Condensed",var(--sans);font-weight:700;font-size:28px;color:var(--fm)}
.fbh-t{display:grid;gap:3px;padding-bottom:8px}
.fbh-t b{font-size:21px;letter-spacing:-.015em;line-height:1.1}
.fbh-t span{font-size:13px;color:var(--fm);line-height:1.35}
.fbh-p{margin:-4px 0 0;font-size:14.5px;line-height:1.5}
.fbh-e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fbh-e div{background:var(--fc);border-radius:16px;padding:11px 13px}
.fbh-e b{font-family:"Barlow Condensed",var(--sans);font-weight:800;font-size:28px;line-height:1}
.fbh-e span{display:block;font-size:12px;color:var(--fm);margin-top:3px;line-height:1.35}
.fbh-tl{display:grid;grid-template-columns:6fr 6fr 6fr 2fr;gap:8px}
.fbh-tl>div{display:grid;gap:4px}
.fbh-tl>div>span{display:grid;grid-auto-flow:column;gap:3px}
.fbh-tl i{height:8px;border-radius:3px;background:#D2D7DD}
.fbh-tl i.dn{background:var(--fi)}
.fbh-tl i.lt{background:repeating-linear-gradient(135deg,#D2D7DD 0 3px,#E4E7EB 3px 6px)}
.fbh-tl i.lt.dn{background:#5E646C}
.fbh-tl i.cur{background:var(--pc)}
.fbh-tl small{font-size:10.5px;color:var(--fm)}
.fbh-nx{font-size:12.5px;color:var(--fm);margin:-8px 0 0;line-height:1.4}
.fbp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fbp-b{border:0;background:transparent;padding:0;display:grid;justify-items:center;gap:7px;color:var(--fi);font:inherit;-webkit-tap-highlight-color:transparent}
.fbp-d{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--fc);box-shadow:inset 0 0 0 5px var(--pc);position:relative;transition:transform .18s,background .25s,color .25s}
.fbp-d::before{content:"";position:absolute;inset:11px;border-radius:50%;border:1.5px solid var(--pc);opacity:.3}
.fbp-d b{font-family:"Barlow Condensed",var(--sans);font-weight:800;font-size:30px;line-height:1;position:relative}
.fbp-b.on .fbp-d{background:var(--pc);color:var(--pt)}
.fbp-b.on .fbp-d::before{border-color:currentColor;opacity:.35}
.fbp-b:active .fbp-d{transform:scale(.94)}
.fbp-l{font-size:12.5px;font-weight:600;line-height:1.2;text-align:center}
.fbp-l small{display:block;font-weight:500;color:var(--fm);font-size:11px}
.fb-sum{margin:0;font-size:13px;color:var(--fm);line-height:1.5}
.fbl{display:grid;gap:8px}
.fbc{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--fc);border:0;border-radius:18px;padding:8px 14px 8px 8px;text-align:left;color:var(--fi);font:inherit;transition:transform .15s}
.fbc:active{transform:scale(.985)}
.fbc-i{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#EEF0F3;display:grid;place-items:center;font-weight:700;font-size:16px;color:#B3BAC2}
.fbc-n{display:block;font-size:15px;font-weight:600;line-height:1.25}
.fbc-t{display:block;font-size:12.5px;color:var(--fm);margin-top:3px;line-height:1.35}

const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));

const MOISC=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

/* ===== Moteur du mannequin ===== */
const FL={l:28,t:34,n:12,hr:11,u:30,f:28,th:44,sh:42,ft:13};
const FW={l:21,t:23,n:9,u:10,f:8.5,th:14,sh:11,ft:6.5};
const rad=a=>a*Math.PI/180, fv=a=>[Math.sin(rad(a)),Math.cos(rad(a))];
const fadd=(p,a,len)=>{const d=fv(a);return [p[0]+d[0]*len,p[1]+d[1]*len]};
function fk(p,view){
  const s=k=>(p.s&&p.s[k]!=null)?p.s[k]:1;
  const P=[0,0],Wj=fadd(P,p.l,FL.l*s("l")),N=fadd(Wj,p.t,FL.t*s("t"));
  const NE=fadd(N,p.h,FL.n*s("h")),H=fadd(N,p.h,(FL.n+FL.hr)*s("h"));
  let shA=N,shB=N,hipA=P,hipB=P;
  if(view==="front"){let pt=fv(p.t-90),pl=fv(p.l-90);if(pt[0]<0)pt=[-pt[0],-pt[1]];if(pl[0]<0)pl=[-pl[0],-pl[1]];shA=[N[0]+pt[0]*13,N[1]+pt[1]*13];shB=[N[0]-pt[0]*13,N[1]-pt[1]*13];hipA=[pl[0]*8,pl[1]*8];hipB=[-pl[0]*8,-pl[1]*8]}
  const fs=view==="front"?0.5:1;
  const arm=(sh,a,k)=>{const e=fadd(sh,a[0],FL.u*s(k+".u"));const w=fadd(e,a[1],FL.f*s(k+".f"));return {sh,e,w}};
  const leg=(hp,a,k)=>{const kn=fadd(hp,a[0],FL.th*s(k+".th"));const an=fadd(kn,a[1],FL.sh*s(k+".sh"));const to=fadd(an,a[2],FL.ft*fs*s(k+".ft"));return {hp,kn,an,to}};
  return {P,W:Wj,N,NE,H,ar:arm(shA,p.ar,"ar"),al:arm(shB,p.al,"al"),lr:leg(hipA,p.lr,"lr"),ll:leg(hipB,p.ll,"ll")};
}
function fsegs(J,view){
  const far=view==="front"?"near":"far";
  const S=[];
  const L=(id,a,b,w,layer)=>S.push({id,a,b,w,layer});
  L("al.u",J.al.sh,J.al.e,FW.u,far);L("al.f",J.al.e,J.al.w,FW.f,far);
  L("ll.th",J.ll.hp,J.ll.kn,FW.th,far);L("ll.sh",J.ll.kn,J.ll.an,FW.sh,far);L("ll.ft",J.ll.an,J.ll.to,FW.ft,far);
  L("l",J.P,J.W,FW.l,"near");L("t",J.W,J.N,FW.t,"near");L("n",J.N,J.NE,FW.n,"near");
  L("lr.th",J.lr.hp,J.lr.kn,FW.th,"near");L("lr.sh",J.lr.kn,J.lr.an,FW.sh,"near");L("lr.ft",J.lr.an,J.lr.to,FW.ft,"near");
  L("ar.u",J.ar.sh,J.ar.e,FW.u,"near");L("ar.f",J.ar.e,J.ar.w,FW.f,"near");
  return S;
}
function jointOf(J,name){
  const m={pelvis:J.P,w:J.W,neck:J.N,head:J.H,"ar.elbow":J.ar.e,"ar.wrist":J.ar.w,"al.wrist":J.al.w,"lr.knee":J.lr.kn,"lr.ankle":J.lr.an,"ll.knee":J.ll.kn,"ll.ankle":J.ll.an,"lr.toe":J.lr.to};
  if(name==="feet")return [(J.lr.an[0]+J.ll.an[0])/2,(J.lr.an[1]+J.ll.an[1])/2];
  return m[name]||J.P;
}
function propsGeom(J,ex){
  const out=[];
  for(const pr of ex.props||[]){
    if(pr.roller){const p=jointOf(J,pr.roller);out.push({type:"circle",c:[p[0],p[1]+FW.t/2+9],r:9})}
    if(pr.block){const p=jointOf(J,pr.block);out.push({type:"rect",x:p[0]-8,y:p[1]+4,w:16,h:12})}
    if(pr.weight){const p=jointOf(J,pr.weight);out.push({type:"circle",c:[p[0],p[1]+7],r:7,fill:true})}
  }
  return out;
}
function bottomOf(J,segs,props){
  let m=J.H[1]+FL.hr;
  for(const s of segs){m=Math.max(m,s.a[1]+s.w/2,s.b[1]+s.w/2)}
  for(const p of props){if(p.type==="circle")m=Math.max(m,p.c[1]+p.r);if(p.type==="rect")m=Math.max(m,p.y+p.h)}
  return m;
}
function lerpPose(a,b,t){
  if(typeof a==="number")return a+(b-a)*t;
  if(Array.isArray(a))return a.map((v,i)=>lerpPose(v,b[i],t));
  const o={};for(const k in a){o[k]=lerpPose(a[k],b[k]!==undefined?b[k]:a[k],t)}
  if(b&&typeof b==="object")for(const k in b){if(!(k in o))o[k]=b[k]}
  return o;
}
function normS(ex){
  const keys=new Set();ex.k.forEach(([p])=>Object.keys(p.s||{}).forEach(k=>keys.add(k)));
  ex.k.forEach(([p])=>{p.s=p.s||{};keys.forEach(k=>{if(p.s[k]==null)p.s[k]=1})});
}
const ease=t=>0.5-0.5*Math.cos(Math.PI*t);
function poseAt(ex,time){
  const K=ex.k,tot=K.reduce((a,x)=>a+x[1],0);let tt=((time%tot)+tot)%tot;
  for(let i=0;i<K.length;i++){if(tt<=K[i][1]||i===K.length-1){const f=K[i][1]?Math.min(1,tt/K[i][1]):1;return lerpPose(K[i][0],K[(i+1)%K.length][0],ex.linear?f:ease(f))}tt-=K[i][1]}
  return K[0][0];
}
/* Calage : même ancre, sol commun, échelle pour tenir dans le cadre */
function layout(ex,Wd,Hd){
  ex._lay=ex._lay||{};const key=Wd+"x"+Hd;if(ex._lay[key])return ex._lay[key];
  let minX=1e9,maxX=-1e9,maxH=0;
  const samples=[];for(let i=0;i<ex.k.length;i++){samples.push(ex.k[i][0]);if(ex.k.length>1)samples.push(lerpPose(ex.k[i][0],ex.k[(i+1)%ex.k.length][0],0.5))}
  for(const p of samples){
    const J=fk(p,ex.view),S=fsegs(J,ex.view),PR=propsGeom(J,ex),A=jointOf(J,ex.anchor||"pelvis"),bot=bottomOf(J,S,PR);
    const xs=[J.H[0]-FL.hr,J.H[0]+FL.hr];S.forEach(s=>{xs.push(s.a[0]-s.w/2,s.a[0]+s.w/2,s.b[0]-s.w/2,s.b[0]+s.w/2)});
    let top=J.H[1]-FL.hr;S.forEach(s=>{top=Math.min(top,s.a[1]-s.w/2,s.b[1]-s.w/2)});
    minX=Math.min(minX,...xs.map(x=>x-A[0]));maxX=Math.max(maxX,...xs.map(x=>x-A[0]));maxH=Math.max(maxH,bot-top);
  }
  const gy=Hd*0.86,sc=Math.min(Wd*0.84/(maxX-minX),(gy-Hd*0.06)/maxH,1.9);
  const ax=Wd/2-((minX+maxX)/2)*sc;
  return ex._lay[key]={W:Wd,H:Hd,gy,sc,ax};
}
function frame(ex,pose,Wd,Hd){
  const L=layout(ex,Wd,Hd),J=fk(pose,ex.view),S=fsegs(J,ex.view),PR=propsGeom(J,ex),A=jointOf(J,ex.anchor||"pelvis"),bot=bottomOf(J,S,PR);
  const X=x=>L.ax+(x-A[0])*L.sc,Y=y=>L.gy+(y-bot)*L.sc;
  const hl=new Set(ex.hl||[]);
  const segs=S.map(s=>({id:s.id,x1:X(s.a[0]),y1:Y(s.a[1]),x2:X(s.b[0]),y2:Y(s.b[1]),w:s.w*L.sc,layer:s.layer,hl:hl.has(s.id)}));
  const head={x:X(J.H[0]),y:Y(J.H[1]),r:FL.hr*L.sc,hl:hl.has("h")};
  const props=PR.map(p=>p.type==="circle"?{type:"circle",x:X(p.c[0]),y:Y(p.c[1]),r:p.r*L.sc,fill:p.fill}:{type:"rect",x:X(p.x),y:Y(p.y),w:p.w*L.sc,h:p.h*L.sc});
  for(const pr of ex.props||[]){if(pr.wall!=null){const p=jointOf(J,pr.wall);props.push({type:"wall",x:X(p[0]+(pr.dx||0))})}if(pr.wallx!=null){props.push({type:"wall",x:L.ax+pr.wallx*L.sc})}}
  return {segs,head,props,gy:L.gy,W:Wd,H:Hd,sc:L.sc};
}
function figSVG(ex,pose,Wd,Hd,col){
  const F=frame(ex,pose,Wd,Hd);
  let s=`<line x1="${(Wd*0.06).toFixed(1)}" x2="${(Wd*0.94).toFixed(1)}" y1="${F.gy.toFixed(1)}" y2="${F.gy.toFixed(1)}" stroke="${col.ground}" stroke-width="1.2"/>`;
  for(const p of F.props){
    if(p.type==="wall")s+=`<line x1="${p.x.toFixed(1)}" x2="${p.x.toFixed(1)}" y1="${(F.gy-150*F.sc).toFixed(1)}" y2="${F.gy.toFixed(1)}" stroke="${col.ground}" stroke-width="2"/>`;
    if(p.type==="circle"&&!p.fill)s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}" fill="none" stroke="${col.ground}" stroke-width="1.5"/>`;
    if(p.type==="rect")s+=`<rect x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" width="${p.w.toFixed(1)}" height="${p.h.toFixed(1)}" fill="none" stroke="${col.ground}" stroke-width="1.5"/>`;
  }
  const seg=g=>`<line x1="${g.x1.toFixed(1)}" y1="${g.y1.toFixed(1)}" x2="${g.x2.toFixed(1)}" y2="${g.y2.toFixed(1)}" stroke="${g.hl?(g.layer==="far"?col.hlFar:col.hl):(g.layer==="far"?col.far:col.near)}" stroke-width="${g.w.toFixed(1)}" stroke-linecap="round"/>`;
  F.segs.filter(g=>g.layer==="far").forEach(g=>s+=seg(g));
  F.segs.filter(g=>g.layer==="near"&&["l","t","n"].includes(g.id)).forEach(g=>s+=seg(g));
  s+=`<circle cx="${F.head.x.toFixed(1)}" cy="${F.head.y.toFixed(1)}" r="${F.head.r.toFixed(1)}" fill="${F.head.hl?col.hl:col.near}"/>`;
  F.segs.filter(g=>g.layer==="near"&&!["l","t","n"].includes(g.id)).forEach(g=>s+=seg(g));
  F.props.filter(p=>p.type==="circle"&&p.fill).forEach(p=>s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}" fill="${col.ground}"/>`);
  return s;
}

 hanches:{n:"Cercles de hanche à 4 pattes",view:"side",anchor:"ll.knee",side:true,hl:["lr.th"],tg:"hanches : rotation et ouverture",k:[[M(QD,{lr:[12,-78,-95]}),1.2],[M(QD,{lr:[82,-8,-60]}),1.2],[M(QD,{lr:[-60,-150,-170]}),1.2],[M(QD,{lr:[-108,-195,-200]}),1.2]],cue:["Le genou dessine le plus grand cercle possible : vers le coude, sur le côté, puis vers l'arrière.","Le reste du corps ne bouge pas."]},
 pincedebout:{n:"Pince debout",view:"side",anchor:"lr.ankle",hold:true,hl:["lr.th"],tg:"arrière des cuisses",k:[[{l:84,t:42,h:28,ar:[12,6],al:[12,6],lr:[0,0,90],ll:[0,0,90]},4],[{l:72,t:28,h:16,ar:[6,2],al:[6,2],lr:[0,0,90],ll:[0,0,90]},4]],cue:["Pieds serrés, jambes tendues sans bloquer les genoux.","Le ventre descend vers les cuisses, dos long. Laisse pendre les bras vers les pieds."]},
 pinceassise:{n:"Pince assise",view:"side",anchor:"pelvis",hold:true,hl:["lr.th"],tg:"arrière des cuisses",k:[[{l:140,t:128,h:122,ar:[82,86],al:[82,86],lr:[90,90,170],ll:[90,90,170]},4],[{l:118,t:104,h:98,ar:[94,92],al:[94,92],lr:[90,90,170],ll:[90,90,170]},4]],cue:["Assis, jambes tendues et serrées, orteils vers toi.","Penche-toi depuis les hanches, dos plat, les mains vers les pieds."]},
 lezard:{n:"Fente du lézard",view:"side",anchor:"ll.knee",side:true,hold:true,hl:["ll.th","lr.th"],tg:"avant de la hanche, ouverture",k:[[{l:122,t:106,h:100,ar:[2,0],al:[2,0],lr:[84,-6,90],ll:[-42,-96,-100]},4],[{l:116,t:98,h:94,ar:[4,0],al:[4,0],lr:[88,-10,90],ll:[-52,-98,-100]},4]],cue:["Grande fente, genou arrière au sol, les deux mains à l'intérieur du pied avant.","Laisse descendre les hanches ; plus tard, les avant-bras au sol."]},
 grenouille:{n:"Grenouille",view:"front",anchor:"pelvis",hold:true,hl:["lr.th","ll.th"],tg:"adducteurs, ouverture des hanches",k:[[{l:180,t:180,h:180,ar:[-24,-8],al:[24,8],lr:[96,4,0],ll:[-96,-4,0],s:{l:.5,t:.55,h:.75}},4],[{l:180,t:180,h:180,ar:[-26,-10],al:[26,10],lr:[100,6,0],ll:[-100,-6,0],s:{l:.45,t:.5,h:.7}},4]],cue:["À quatre pattes, genoux très écartés, tibias parallèles, pieds tournés vers l'extérieur.","Sur les avant-bras, recule doucement les hanches vers les talons."]},
 cosaque:{n:"Squat cosaque",view:"front",anchor:"feet",hl:["lr.th","ll.th"],tg:"adducteurs, hanches",k:[[{l:180,t:180,h:180,ar:[-25,195],al:[25,165],lr:[55,-5,60],ll:[-62,-62,180]},1.8],[{l:180,t:180,h:180,ar:[-25,195],al:[25,165],lr:[26,0,45],ll:[-26,0,-45]},1],[{l:180,t:180,h:180,ar:[-25,195],al:[25,165],lr:[62,62,180],ll:[-55,5,-60]},1.8],[{l:180,t:180,h:180,ar:[-25,195],al:[25,165],lr:[26,0,45],ll:[-26,0,-45]},1]],cue:["Pieds très écartés, descends sur une jambe, l'autre reste tendue.","Talon au sol, poitrine haute."]},
 lateral:{n:"Inclinaison latérale",view:"front",anchor:"feet",hl:["t"],tg:"flancs",k:[[M(STF,{t:150,h:146,ar:[18,14],al:[160,148]}),1.8],[M(STF,{al:[-12,-5]}),0.8],[M(STF,{t:210,h:214,ar:[200,212],al:[-18,-14]}),1.8],[M(STF,{al:[-12,-5]}),0.8]],cue:["Un bras passe au-dessus de la tête, le buste penche sur le côté.","Le bassin reste fixe."]},
 squat:{n:"Squat profond tenu",view:"side",anchor:"lr.ankle",hl:["lr.th","lr.sh"],tg:"hanches, chevilles",k:[[{l:150,t:160,h:165,ar:[40,150],al:[40,150],lr:[110,-25,90],ll:[110,-25,90]},2],[{l:140,t:150,h:160,ar:[44,152],al:[44,152],lr:[113,-32,90],ll:[113,-32,90]},2]],cue:["Talons au sol, coudes poussent les genoux vers l'extérieur.","Balance-toi doucement d'avant en arrière."]},
 balancier:{n:"Balancier de jambe",view:"side",anchor:"ll.ankle",side:true,hl:["lr.th"],tg:"hanches",k:[[M(ST,{lr:[72,58,100],ar:[-35,-28],al:[35,30]}),1],[M(ST,{lr:[-35,-30,60],ar:[35,30],al:[-35,-28]}),1]],cue:["Une main au mur, la jambe balance d'avant en arrière.","Amplitude qui grandit à chaque passage."]},
 cheville:{n:"Chevilles : genou vers l'avant",view:"side",anchor:"lr.ankle",side:true,hl:["lr.sh"],tg:"mollets, chevilles",k:[[{l:178,t:178,h:180,ar:[48,75],al:[48,75],lr:[78,12,90],ll:[-8,-90,-95]},1.6],[{l:172,t:170,h:174,ar:[55,80],al:[55,80],lr:[70,36,90],ll:[-2,-90,-95]},1.6]],cue:["Un genou au sol, le pied avant à plat et droit.","Le genou avance au-dessus des orteils, talon collé : c'est le mollet profond qui s'étire."]},

 canape:{n:"Fente du canapé",view:"side",anchor:"lr.knee",side:true,hold:true,hl:["lr.th"],tg:"avant de la hanche, quadriceps",props:[{wall:"lr.knee",dx:-9}],k:[[{l:170,t:172,h:178,ar:[38,80],al:[38,80],lr:[-18,180,205],ll:[86,0,90]},4],[{l:181,t:183,h:182,ar:[36,78],al:[36,78],lr:[-22,178,205],ll:[84,2,90]},4]],cue:["Genou arrière dans le coin du mur, tibia contre le mur. Au début, mains sur une caisse devant toi.","Serre le fessier arrière, la moitié du temps buste penché, l'autre moitié buste droit."]},
 pigeon:{n:"Pigeon",view:"side",anchor:"pelvis",side:true,hold:true,hl:["ll.th"],tg:"fessiers",k:[[{l:150,t:165,h:172,ar:[6,0],al:[6,0],lr:[-93,-90,-88],ll:[92,-90,-90],s:{"ll.th":.8,"ll.sh":.4,"ll.ft":.5}},4],[{l:112,t:92,h:88,ar:[100,90],al:[100,90],lr:[-93,-90,-88],ll:[92,-90,-90],s:{"ll.th":.8,"ll.sh":.4,"ll.ft":.5}},4]],cue:["Tibia avant en travers, jambe arrière allongée.","Descends la poitrine dos plat, jamais rond. Genou sensible : pied avant plus près du corps."]},
 demiecart:{n:"Demi-grand écart",view:"side",anchor:"ll.knee",side:true,hold:true,hl:["lr.th","lr.sh"],tg:"ischio-jambiers",k:[[{l:140,t:130,h:122,ar:[30,12],al:[30,12],lr:[60,60,165],ll:[0,-90,-95]},4],[{l:126,t:112,h:102,ar:[42,18],al:[42,18],lr:[60,60,165],ll:[0,-90,-95]},4]],cue:["Jambe avant tendue, orteils vers toi.","Dos droit, bassin basculé vers l'avant, fesses vers l'arrière."]},
 cosaquetenu:{n:"Fente latérale tenue",view:"front",anchor:"feet",side:true,hold:true,hl:["ll.th"],tg:"adducteurs",k:[[{l:180,t:180,h:180,ar:[-25,195],al:[25,165],lr:[55,-5,60],ll:[-62,-62,180]},4],[{l:180,t:180,h:180,ar:[-25,195],al:[25,165],lr:[61,-11,60],ll:[-68,-68,180]},4]],cue:["Jambe tendue sur le côté, talon au sol.","Descends sur la jambe pliée, poitrine haute."]},
 mollet:{n:"Mollet au mur",view:"side",anchor:"lr.ankle",side:true,hold:true,hl:["lr.sh"],tg:"mollets",props:[{wall:"ar.wrist",dx:6}],k:[[{l:152,t:150,h:152,ar:[122,112],al:[122,112],lr:[-22,-22,72],ll:[35,2,90]},4],[{l:148,t:145,h:148,ar:[118,108],al:[118,108],lr:[-28,-28,66],ll:[38,4,90]},4]],cue:["Mains au mur, jambe arrière tendue, pied bien droit.","Talon collé au sol, voûte du pied tenue."]},
 pecs:{n:"Pectoraux au cadre de porte",view:"side",anchor:"lr.ankle",side:true,hold:true,hl:["ar.u"],tg:"pectoraux, épaules",props:[{wall:"ar.elbow",dx:-6}],k:[[{l:178,t:176,h:178,ar:[-96,180],al:[0,0],lr:[15,0,90],ll:[-15,-15,90]},4],[{l:174,t:168,h:172,ar:[-104,176],al:[0,0],lr:[18,0,90],ll:[-15,-15,90]},4]],cue:["Avant-bras contre le cadre, coude à hauteur d'épaule.","Avance doucement le buste."]},
 chiot:{n:"Posture du chiot",view:"side",anchor:"lr.knee",hold:true,hl:["ar.u","t"],tg:"épaules, dorsaux",k:[[{l:80,t:38,h:32,ar:[78,90],al:[78,90],lr:[0,-90,-95],ll:[0,-90,-95]},4],[{l:78,t:30,h:26,ar:[82,92],al:[82,92],lr:[0,-90,-95],ll:[0,-90,-95]},4]],cue:["Hanches au-dessus des genoux, bras loin devant.","La poitrine descend vers le sol. Arrête-toi là où tu peux encore contracter l'épaule."]},
 rouleau:{n:"Extension du haut du dos sur rouleau",view:"side",anchor:"pelvis",hold:true,hl:["t"],tg:"haut du dos",props:[{roller:"w"}],k:[[{l:125,t:72,h:52,ar:[72,76],al:[72,76],lr:[-140,-20,-90],ll:[-140,-20,-90]},4],[{l:125,t:62,h:40,ar:[64,68],al:[64,68],lr:[-140,-20,-90],ll:[-140,-20,-90]},4]],cue:["Rouleau sous le milieu du dos, bras au-dessus de la tête, tête soutenue.","Laisse le haut du dos s'ouvrir. Monte le rouleau d'un cran toutes les 30 s."]},

 pontfessier:{n:"Pont fessier",view:"side",anchor:"lr.ankle",hl:["lr.th","l"],tg:"fessiers, avant des hanches",k:[[SUP,1.6],[{l:62,t:76,h:88,ar:[-90,-90],al:[-90,-90],lr:[-122,-6,-90],ll:[-122,-6,-90]},2.4]],cue:["Pieds à plat, pousse dans les talons.","Monte jusqu'à aligner genoux, hanches et épaules."]},
 tableinv:{n:"Table inversée",view:"side",anchor:"ar.wrist",hl:["lr.th","ar.u","t"],tg:"épaules, avant des hanches",k:[[{l:168,t:166,h:176,ar:[-28,-24],al:[-28,-24],lr:[138,-12,90],ll:[138,-12,90]},1.8],[{l:270,t:268,h:300,ar:[-8,-6],al:[-8,-6],lr:[92,2,90],ll:[92,2,90]},2.6]],cue:["Mains derrière toi, doigts vers les pieds.","Monte les hanches à l'horizontale, tête en arrière."]},
 pontmur:{n:"Pont contre le mur",view:"side",anchor:"feet",hl:["t","l","ar.u"],tg:"dos, épaules",props:[{wallx:-100}],k:[[{l:186,t:200,h:212,ar:[200,212],al:[200,212],lr:[12,-4,90],ll:[12,-4,90]},2],[{l:204,t:246,h:272,ar:[250,262],al:[250,262],lr:[28,-14,90],ll:[28,-14,90]},2.6]],cue:["Dos au mur, à un pas. Bras au-dessus de la tête.","Cambre et descends les mains le long du mur, puis remonte."]},
 pont:{n:"Pont complet",view:"side",anchor:"lr.ankle",hl:["l","t","ar.u","lr.th"],tg:"dos, épaules, avant des hanches",k:[[{l:90,t:90,h:90,ar:[176,22],al:[176,22],lr:[-140,-20,-90],ll:[-140,-20,-90]},1.8],[{l:110,t:35,h:10,ar:[-2,-2],al:[-2,-2],lr:[-36,-6,-90],ll:[-36,-6,-90]},3]],cue:["Mains à côté des oreilles, pousse dans les mains et les pieds.","Bras tendus, épaules au-dessus des mains."]},

 papillon:{n:"Papillon",view:"front",anchor:"pelvis",hold:true,hl:["lr.th","ll.th"],tg:"adducteurs",k:[[{l:180,t:180,h:180,ar:[-14,-24],al:[14,24],lr:[114,-72,-60],ll:[-114,72,60]},4],[{l:180,t:180,h:178,ar:[-10,-20],al:[10,20],lr:[98,-74,-60],ll:[-98,74,60],s:{t:.82}},4]],cue:["Plantes de pieds collées, dos contre un mur au début.","Descends les genoux avec les muscles de la hanche, pas avec les mains."]},
 pancake:{n:"Assis jambes écartées",view:"front",anchor:"pelvis",hold:true,hl:["lr.th","ll.th"],tg:"adducteurs, ischio-jambiers",k:[[{l:180,t:180,h:180,ar:[18,8],al:[-18,-8],lr:[94,94,180],ll:[-94,-94,-180]},4],[{l:180,t:180,h:180,ar:[22,6],al:[-22,-6],lr:[94,94,180],ll:[-94,-94,-180],s:{l:.6,t:.55,h:.8}},4]],cue:["Jambes le plus écartées possible, genoux vers le plafond.","Dos plat, le ventre descend vers le sol."]},
 fenteecart:{n:"Fente basse ↔ demi-écart",view:"side",anchor:"ll.knee",side:true,hl:["ll.th","lr.th"],tg:"avant de la hanche, ischio-jambiers",k:[[{l:178,t:178,h:180,ar:[40,78],al:[40,78],lr:[74,8,90],ll:[-34,-90,-95]},2.4],[{l:134,t:122,h:112,ar:[34,14],al:[34,14],lr:[60,60,165],ll:[0,-90,-95]},2.4]],cue:["Fente basse, puis recule les hanches jambe avant tendue.","Alterne lentement."]},
 ecartblocs:{n:"Grand écart sur blocs",view:"side",anchor:"pelvis",side:true,hold:true,hl:["ll.th","lr.th"],tg:"avant des hanches, ischio-jambiers",props:[{block:"ar.wrist"}],k:[[{l:178,t:178,h:180,ar:[4,0],al:[4,0],lr:[66,66,165],ll:[-68,-68,-100]},4],[{l:178,t:178,h:180,ar:[6,0],al:[6,0],lr:[76,76,168],ll:[-78,-78,-96]},4]],cue:["Mains sur des blocs, jambe avant tendue, jambe arrière tendue.","Le bassin descend doucement, bien de face."]},
 ecart:{n:"Grand écart",view:"side",anchor:"pelvis",side:true,hold:true,hl:["ll.th","lr.th"],tg:"avant des hanches, ischio-jambiers",k:[[{l:178,t:178,h:180,ar:[12,0],al:[12,0],lr:[84,84,170],ll:[-84,-84,-94]},4],[{l:172,t:170,h:174,ar:[16,2],al:[16,2],lr:[89,89,172],ll:[-89,-89,-92]},4]],cue:["Bassin face à l'avant, jambes tendues.","Respire et laisse descendre."]},
 cosaqueleste:{n:"Squat cosaque lesté",view:"front",anchor:"feet",hl:["lr.th","ll.th"],tg:"force en fin d'amplitude",props:[{weight:"ar.wrist"}],k:[[{l:180,t:180,h:180,ar:[-22,8],al:[22,-8],lr:[55,-5,60],ll:[-62,-62,180]},1.8],[{l:180,t:180,h:180,ar:[-22,8],al:[22,-8],lr:[26,0,45],ll:[-26,0,-45]},1],[{l:180,t:180,h:180,ar:[-22,8],al:[22,-8],lr:[62,62,180],ll:[-55,5,-60]},1.8],[{l:180,t:180,h:180,ar:[-22,8],al:[22,-8],lr:[26,0,45],ll:[-26,0,-45]},1]],cue:["Sac à dos chargé tenu devant toi, à deux mains.","Descends lentement en 3 secondes, talon au sol, pause en bas."]},
 goodmorning:{n:"Bonjour jambes écartées",view:"side",anchor:"feet",hl:["lr.th"],tg:"ischio-jambiers, bas du dos",k:[[M(ST,{ar:[152,-100],al:[152,-100],lr:[4,0,90],ll:[4,0,90]}),1.8],[{l:100,t:96,h:102,ar:[72,-180],al:[72,-180],lr:[14,-2,90],ll:[14,-2,90]},2.2]],cue:["Sac à dos serré contre la poitrine, genoux souples.","Recule les hanches dos plat jusqu'à la limite, pause 3 s, remonte."]},

 curlup:{n:"Relevé de tête de McGill",view:"side",anchor:"pelvis",hl:["t","n","h"],tg:"abdominaux, colonne qui ne bouge pas",linear:true,k:[[M(SUP,{t:99,h:106,ar:[-70,-110],al:[-70,-110],ll:[-90,-90,180]}),7.5],[M(SUP,{t:100,h:107,ar:[-70,-110],al:[-70,-110],ll:[-90,-90,180]}),1],[M(SUP,{ar:[-70,-110],al:[-70,-110],ll:[-90,-90,180]}),1],[M(SUP,{t:91,h:91,ar:[-70,-110],al:[-70,-110],ll:[-90,-90,180]}),0.5]],cue:["Mains sous le creux du dos, un genou plié, l'autre jambe tendue.","Soulève à peine la tête et les épaules, comme si tu allégeais une balance. Tiens 8 s, le dos ne bouge pas."]},
 sidebridge:{n:"Pont latéral",view:"front",anchor:"pelvis",side:true,hl:["l","t","lr.th","ll.th"],tg:"flancs, obliques, carré des lombes",linear:true,k:[[{l:104,t:104,h:104,ar:[-20,-110],al:[0,90],lr:[-76,-76,170],ll:[-78,-78,170]},7.5],[{l:105,t:105,h:105,ar:[-20,-110],al:[0,90],lr:[-77,-77,170],ll:[-79,-79,170]},1],[{l:124,t:124,h:120,ar:[-20,-110],al:[0,90],lr:[-90,-90,175],ll:[-92,-92,175]},1],[{l:125,t:125,h:121,ar:[-20,-110],al:[0,90],lr:[-90,-90,175],ll:[-92,-92,175]},0.5]],cue:["Sur le coude, pieds l'un devant l'autre, corps en ligne droite.","Tiens 8 s, pose la hanche, repars. Débutant : sur les genoux."]},
 birddog:{n:"Chien de chasse",view:"side",anchor:"lr.knee",side:true,hl:["ar.u","ar.f","ll.th","ll.sh"],tg:"dos, fessiers, épaules",linear:true,k:[[M(QD,{ar:[90,90],ll:[-90,-90,-100]}),7.5],[M(QD,{ar:[91,91],ll:[-91,-91,-100]}),1],[M(QD,{ar:[20,5],ll:[-25,-95,-95]}),1],[M(QD,{ar:[22,6],ll:[-27,-95,-95]}),0.5]],cue:["Bras et jambe opposés tendus, dos plat, poing fermé, talon poussé loin.","Tiens 8 s, reviens balayer le sol sans le toucher, repars."]},
 kickav:{n:"Levé de jambe avant",view:"side",anchor:"ll.ankle",side:true,hl:["lr.th","lr.sh"],tg:"arrière des cuisses, hanches",k:[[{l:180,t:180,h:180,ar:[90,92],al:[30,20],lr:[-8,-8,82],ll:[0,0,90]},0.75],[{l:177,t:180,h:180,ar:[90,92],al:[30,20],lr:[122,122,212],ll:[0,0,90]},0.75]],cue:["Jambe tendue : tu la lèves, tu ne la lances pas. Le bras tendu devant sert de cible.","Jambe d'appui tendue, talon au sol. Commence bas, monte un peu plus à chaque fois."],thumb:1},
 kicklat:{n:"Levé de jambe latéral",view:"front",anchor:"ll.ankle",side:true,hl:["lr.th","lr.sh"],tg:"adducteurs, hanches",k:[[{l:180,t:180,h:180,ar:[70,80],al:[-40,-30],lr:[6,4,50],ll:[-4,0,-45]},0.75],[{l:170,t:168,h:172,ar:[78,84],al:[-40,-30],lr:[98,108,140],ll:[-4,0,-45],s:{t:0.92}},0.75]],cue:["Le genou monte avant le pied, bord extérieur du pied devant.","Bascule le bassin vers l'avant, buste un peu penché : sinon la hanche coince."],thumb:1},
 kickarr:{n:"Levé de jambe arrière",view:"side",anchor:"ll.ankle",side:true,hl:["lr.th","lr.sh"],tg:"avant des hanches",props:[{wall:"ar.wrist",dx:3}],k:[[{l:165,t:150,h:150,ar:[60,62],al:[60,62],lr:[6,6,95],ll:[0,0,90]},0.75],[{l:158,t:140,h:140,ar:[60,62],al:[60,62],lr:[-62,-62,25],ll:[0,0,90]},0.75]],cue:["Mains au mur, buste penché, la jambe tendue monte derrière.","Sens l'étirement à l'avant de la cuisse. Contrôlé, jamais lancé."],thumb:1},
 cavalier:{n:"Position du cavalier",view:"front",anchor:"pelvis",hold:true,hl:["lr.th","ll.th"],tg:"adducteurs, cuisses : la base de l'écart facial",k:[[{l:180,t:180,h:180,ar:[-30,40],al:[30,-40],lr:[78,-4,60],ll:[-78,4,-60]},4],[{l:180,t:180,h:180,ar:[-30,40],al:[30,-40],lr:[82,-6,60],ll:[-82,6,-60]},4]],cue:["Pieds parallèles, orteils devant, cuisses vers l'horizontale, buste droit.","D'abord plus bas, ensuite plus large. Respire calmement."]},

    const last=p[p.length-1];return area+`<path d="${d}" fill="none" stroke="${sr.c}" stroke-width="${sr.w||2.2}" stroke-linejoin="round" stroke-linecap="round"${sr.dash?` stroke-dasharray="${sr.dash}"`:""}/>${sr.dots?p.map(q=>`<circle cx="${X(q.x).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="2.6" fill="${sr.c}"/>`).join(""):""}<circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="4" fill="${sr.c}" stroke="${dark?"#17181B":"#fff"}" stroke-width="2"/>`}).join("");
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"Graphique")}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${series[0].c}" stop-opacity=".28"/><stop offset="1" stop-color="${series[0].c}" stop-opacity="0"/></linearGradient></defs>${g}${paths}</svg>`}
const kt=k=>parseKey(k).getTime();
/* ----- Course : sorties enregistrées (GPS ou à la main), stockées dans le jour : d.runs ----- */

  const d=P.map((p,i)=>`${i?"L":"M"}${T(p).join(" ")}`).join(" "),a=T(P[0]),b=T(P[P.length-1]),c=o.c||"#C6F36B";
